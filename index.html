              {/* 練ゼミノート専用UI（v17: 範囲フィルタ・期限表示・自動記録） */}
              {activeSubj==='練ゼミ'&&(()=>{
                const sN=stripGrade(jhFullName);
                const a=jhRenzemiAssign[sN]||{};
                // v20: 教室長UIと統一した正規化ヘルパーを使用（旧形式・新形式どちらでもOK）
                const normalize=v=>normalizeRenzemiSubj(v,'math',currentTerm);
                // ※ math/eng で同じ判定式なので、教科キーは仮で'math'を渡しても結果は変わらない
                const STATUS_BG={'未':'#f3f4f6','◯':'#d1fae5','△':'#fef3c7','✗':'#fee2e2'};
                const STATUS_COL={'未':'#9ca3af','◯':'#065f46','△':'#92400e','✗':'#991b1b'};
                const STATUS_ACTIVE_BG={'未':'#9ca3af','◯':'#10b981','△':'#f59e0b','✗':'#ef4444'};
                const STATUS_OPTS=['未','◯','△','✗'];
                // 残日数算出
                const daysToDeadline=(deadline)=>{
                  if(!deadline) return null;
                  const t=new Date(deadline+'T23:59:59').getTime();
                  if(isNaN(t)) return null;
                  return Math.ceil((t-Date.now())/(1000*60*60*24));
                };
                const renderSection=(subjKey,subjLabel,subjConf,headColor,borderColor)=>{
                  if(!subjConf||!subjConf.taking||!subjConf.grade) return null;
                  const grade=subjConf.grade;
                  const gradeTerm=`${grade}${currentTerm}`;
                  const allItems=RENZEMI_BOOKS[`${subjKey}${gradeTerm}`]||[];
                  // v43: 紗耶佳先生のお言葉「項目とレベルは別概念」に沿って、全項目を常に表示
                  //   旧バグ: it.num <= rangeEnd で項目を絞っていた（レベル3→項目3つしか表示されない）
                  //   新仕様: 全項目を表示し、各項目内で「レベル○までの問題を解く」と講師に伝える
                  const items=allItems;
                  // 設定レベル（ヘッダーに表示するための値）
                  const lv=subjConf.rangeEnd||RENZEMI_LEVEL_MAX;
                  const deadline=getDeadline(jhRenzemiDeadlines,grade,currentTerm,subjKey);
                  const dDays=daysToDeadline(deadline);
                  // 期限色判定
                  let dlColor='#374151',dlBg='#f9fafb',dlMsg='';
                  if(deadline){
                    if(dDays===null) dlMsg='';
                    else if(dDays<0){dlColor='#dc2626';dlBg='#fee2e2';dlMsg=`期限超過 ${Math.abs(dDays)}日`;}
                    else if(dDays<=7){dlColor='#ea580c';dlBg='#ffedd5';dlMsg=`残り${dDays}日 急いで！`;}
                    else if(dDays<=14){dlColor='#d97706';dlBg='#fef3c7';dlMsg=`残り${dDays}日`;}
                    else {dlColor='#059669';dlBg='#d1fae5';dlMsg=`残り${dDays}日`;}
                  }
                  // 進捗集計
                  const totalC=items.length;
                  const doneC=items.filter(it=>{const p=getRenzemiProg(jhRenzemiProgress,sN,subjKey,gradeTerm,it.num);return p&&p.first==='◯';}).length;
                  return(
                    <div style={{background:'white',borderRadius:'10px',marginBottom:'14px',overflow:'hidden',border:`2px solid ${borderColor}`}}>
                      {/* ヘッダ */}
                      <div style={{background:headColor,color:'white',padding:'10px 14px'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'6px'}}>
                          <div>
                            <div style={{fontWeight:'bold',fontSize:'15px'}}>{subjLabel}（{grade}年{currentTerm}） 全{totalC}項目</div>
                            <div style={{fontSize:'11px',marginTop:'2px',background:'rgba(255,255,255,0.25)',display:'inline-block',padding:'2px 8px',borderRadius:'4px'}}>💡 各項目内のレベル{lv}までの問題を解かせる</div>
                          </div>
                          <span style={{fontSize:'12px',background:'rgba(255,255,255,0.25)',padding:'2px 8px',borderRadius:'10px'}}>1周目達成 {doneC}/{totalC}</span>
                        </div>
                      </div>
                      {/* 期限バナー */}
                      {deadline&&(
                        <div style={{background:dlBg,padding:'8px 14px',borderBottom:'1px solid #e5e7eb',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <span style={{fontSize:'13px',color:dlColor,fontWeight:'bold'}}>🗓 期限：{deadline}</span>
                          <span style={{fontSize:'13px',color:dlColor,fontWeight:'bold'}}>{dlMsg}</span>
                        </div>
                      )}
                      {!deadline&&(
                        <div style={{background:'#f9fafb',padding:'6px 14px',borderBottom:'1px solid #e5e7eb',fontSize:'11px',color:'#9ca3af'}}>
                          🗓 期限：未設定（教室長アプリ「期限を一括登録」から設定可能）
                        </div>
                      )}
                      {/* テーブルヘッダ */}
                      <div style={{display:'grid',gridTemplateColumns:'34px 1fr 175px 175px 90px',background:'#f9fafb',padding:'6px 8px',fontSize:'10px',color:'#6b7280',fontWeight:'bold',borderBottom:'1px solid #e5e7eb'}}>
                        <div style={{textAlign:'center'}}>#</div>
                        <div>項目</div>
                        <div style={{textAlign:'center'}}>1周目</div>
                        <div style={{textAlign:'center'}}>×やり直し</div>
                        <div style={{textAlign:'center'}}>最終チェック</div>
                      </div>
                      {items.length===0&&(
                        <p style={{padding:'24px',textAlign:'center',color:'#9ca3af',fontSize:'12px'}}>
                          ※ {currentTerm}テキストはまだ未投入
                        </p>
                      )}
                      {items.map(it=>{
                        const prog=getRenzemiProg(jhRenzemiProgress,sN,subjKey,gradeTerm,it.num)||{first:'未',redo:'未'};
                        const renderBtnGroup=(col,curVal)=>(
                          <div style={{display:'flex',justifyContent:'center',gap:'2px'}}>
                            {STATUS_OPTS.map(opt=>{
                              const isActive=curVal===opt;
                              return(
                                <button key={opt} onClick={()=>jhSaveRenzemiProgress(sN,subjKey,gradeTerm,it.num,col,opt,selTeacher)}
                                  style={{width:'34px',height:'34px',borderRadius:'6px',border:isActive?`2px solid ${STATUS_COL[opt]}`:'1px solid #e5e7eb',background:isActive?STATUS_ACTIVE_BG[opt]:'white',color:isActive?'white':STATUS_COL[opt],fontWeight:'bold',cursor:'pointer',fontSize:'14px',padding:0}}>
                                  {opt}
                                </button>
                              );
                            })}
                          </div>
                        );
                        return(
                          <div key={it.num} style={{display:'grid',gridTemplateColumns:'34px 1fr 175px 175px 90px',padding:'6px 8px',borderBottom:'1px solid #f3f4f6',alignItems:'center'}}>
                            <div style={{textAlign:'center',color:'#9ca3af',fontSize:'12px'}}>{it.num}</div>
                            <div style={{fontSize:'12px',color:'#374151'}}>{it.text}</div>
                            <div>{renderBtnGroup('first',prog.first)}</div>
                            <div>{renderBtnGroup('redo',prog.redo)}</div>
                            <div style={{textAlign:'center',fontSize:'10px',color:'#6b7280',lineHeight:1.3}}>
                              {prog.checkedAt?(<>{prog.checkedAt}<br/>{prog.checkedBy||'-'}</>):'-'}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                };
                const mathConf=normalizeRenzemiSubj(a.math,'math',currentTerm);
                const engConf=normalizeRenzemiSubj(a.eng,'eng',currentTerm);
                const noAssign=!mathConf.taking&&!engConf.taking;
                return(
                  <div>
                    <div style={{background:'#fef3c7',border:'1px solid #fbbf24',borderRadius:'8px',padding:'10px 14px',marginBottom:'12px'}}>
                      <p style={{fontWeight:'bold',fontSize:'13px',color:'#92400e',marginBottom:'4px'}}>📓 練ゼミノート（自習用） {currentTerm}テキスト</p>
                      <p style={{fontSize:'11px',color:'#78350f'}}>未・◯・△・✗ から直接タップして記録します。日付と先生名は自動で残ります。</p>
                    </div>
                    {mathConf.taking
                      ? renderSection('math','📐 数学',mathConf,'#ea580c','#fdba74')
                      : (!noAssign && <div style={{background:'#f9fafb',border:'1px dashed #d1d5db',borderRadius:'10px',marginBottom:'14px',padding:'16px',textAlign:'center',color:'#9ca3af',fontSize:'13px',fontWeight:'bold'}}>📐 数学：練ゼミ受講なし</div>)}
                    {engConf.taking
                      ? renderSection('eng','📖 英語',engConf,'#2563eb','#93c5fd')
                      : (!noAssign && <div style={{background:'#f9fafb',border:'1px dashed #d1d5db',borderRadius:'10px',marginBottom:'14px',padding:'16px',textAlign:'center',color:'#9ca3af',fontSize:'13px',fontWeight:'bold'}}>📖 英語：練ゼミ受講なし</div>)}
                    {noAssign&&(
                      <p style={{textAlign:'center',color:'#9ca3af',padding:'40px 20px',fontSize:'13px'}}>
                        この生徒には練ゼミノートの受講設定がありません
                      </p>
                    )}
                  </div>
                );
              })()}

              {/* v101 英単語テスト */}
              {activeSubj==='英単語'&&(()=>{
                const sN=stripGrade(jhFullName);
                const book=vocabBookOf(jhVocabAssign,sN);
                const half=vocabHalfOf(jhVocabHalf,sN);
                const items=vocabItemsFor(book,half);
                const rate=vocabPassRateOf(jhVocabPassRateByName,sN,jhVocabPassRate);
                const headColor=book==='foresta'?'#7c3aed':'#0d9488';
                const statusOf=(it)=>{
                  const att=vocabAttempts(jhVocabProgress[vocabKey(sN,book,it.num)]);
                  const pass=vocabPassPoint(it.max,rate);
                  let passedAt=-1;
                  att.forEach((a,i)=>{if(passedAt<0&&typeof a.score==='number'&&a.score>=pass)passedAt=i;});
                  return {att,pass,passedAt};
                };
                const doneC=items.filter(it=>statusOf(it).passedAt>=0).length;
                return(
                  <div>
                    <div style={{background:'#ede9fe',border:'1px solid #c4b5fd',borderRadius:'8px',padding:'10px 14px',marginBottom:'12px'}}>
                      <p style={{fontWeight:'bold',fontSize:'13px',color:'#5b21b6',marginBottom:'4px'}}>📝 英単語テスト（合格ライン {Math.round(rate*100)}％）</p>
                      <p style={{fontSize:'11px',color:'#6d28d9'}}>各回の点数を入力。合格点に届くと「合格」。<b>2回不合格で3回目に進むと「⚠️ 教室長面談」</b>が出ます（最大5回）。</p>
                    </div>
                    {/* テキスト切替＋モード表示 */}
                    <div style={{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap',alignItems:'center'}}>
                      {['foresta','target1800'].map(bk=>{
                        const on=bk===book;
                        return(<button key={bk} onClick={()=>{if(!on)jhSaveVocabAssign(sN,bk);}}
                          style={{padding:'8px 16px',borderRadius:'8px',border:on?'2px solid '+headColor:'1px solid #d1d5db',background:on?headColor:'white',color:on?'white':'#6b7280',fontWeight:'bold',cursor:on?'default':'pointer',fontSize:'13px'}}>
                          {on?'✓ ':''}{VOCAB_LABEL[bk]}</button>);
                      })}
                      {book==='foresta'&&half&&<span style={{background:'#fef3c7',color:'#92400e',padding:'4px 10px',borderRadius:'10px',fontSize:'12px',fontWeight:'bold'}}>半分モード（20語ずつ）</span>}
                      {book==='foresta'&&!half&&<span style={{color:'#9ca3af',fontSize:'11px'}}>※半分モードは教室長アプリで設定できます</span>}
                    </div>
                    <div style={{background:'white',borderRadius:'10px',overflow:'hidden',border:'2px solid '+headColor}}>
                      <div style={{background:headColor,color:'white',padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'6px'}}>
                        <span style={{fontWeight:'bold',fontSize:'15px'}}>{VOCAB_LABEL[book]}{half&&book==='foresta'?'（半分）':''} 全{items.length}範囲</span>
                        <span style={{fontSize:'12px',background:'rgba(255,255,255,0.25)',padding:'2px 8px',borderRadius:'10px'}}>合格 {doneC}/{items.length}</span>
                      </div>
                      {items.map(it=>{
                        const st=statusOf(it);
                        const att=st.att,pass=st.pass,passedAt=st.passedAt;
                        const passed=passedAt>=0;
                        const showN=passed?(passedAt+1):Math.min(VOCAB_MAX_ATTEMPTS,att.length+1);
                        const needMen=!passed&&att.length>=2;
                        return(
                          <div key={it.num} style={{padding:'8px 10px',borderBottom:'1px solid #f3f4f6',background:passed?'#f0fdf4':(needMen?'#fef2f2':'white')}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px',flexWrap:'wrap',gap:'6px'}}>
                              <div style={{fontSize:'13px',color:'#374151'}}><b>{it.label}</b> <span style={{color:'#9ca3af',fontSize:'11px'}}>（{it.range}）</span> <span style={{color:headColor,fontSize:'11px',fontWeight:'bold'}}>合格{pass}点/{it.max}</span></div>
                              <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
                                {passed&&<span style={{background:'#16a34a',color:'white',padding:'2px 10px',borderRadius:'10px',fontSize:'12px',fontWeight:'bold'}}>✓ {passedAt+1}回目で合格</span>}
                                {needMen&&<span style={{background:'#dc2626',color:'white',padding:'2px 10px',borderRadius:'10px',fontSize:'12px',fontWeight:'bold'}}>⚠️ 教室長面談</span>}
                              </div>
                            </div>
                            <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
                              {Array.from({length:showN}).map((_,i)=>{
                                const a=att[i]||{};
                                const has=typeof a.score==='number';
                                const ok=has&&a.score>=pass;
                                return(
                                  <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'2px'}}>
                                    <span style={{fontSize:'10px',color:'#9ca3af'}}>{i+1}回目</span>
                                    <input type="number" min="0" max={it.max} defaultValue={has?a.score:''}
                                      key={sN+'_'+book+'_'+half+'_'+it.num+'_'+i+'_'+(a.date||'')}
                                      onBlur={e=>{let v=e.target.value;if(v===''){jhSaveVocabScore(sN,book,it.num,i,'',selTeacher);return;}v=Math.max(0,Math.min(it.max,Math.round(Number(v))));e.target.value=v;jhSaveVocabScore(sN,book,it.num,i,v,selTeacher);}}
                                      style={{width:'52px',height:'32px',textAlign:'center',border:has?(ok?'2px solid #16a34a':'2px solid #dc2626'):'1px solid #d1d5db',borderRadius:'6px',fontSize:'14px',fontWeight:'bold',color:has?(ok?'#15803d':'#b91c1c'):'#111827',background:'white'}}/>
                                    <span style={{fontSize:'10px',color:has?(ok?'#16a34a':'#dc2626'):'#d1d5db',fontWeight:'bold'}}>{has?(ok?'合格':'不合格'):'—'}</span>
                                    <span style={{fontSize:'9px',color:'#9ca3af',lineHeight:1}}>{a.date?a.date.slice(5):''}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

              {/* 項目リスト */}
              {activeSubj!=='練ゼミ'&&jhChapters.length>0&&jhSi>=0&&(()=>{
                const sName=(jhFullName||'').replace(/（.+?）/,'');
                const school=jhSchoolOverrides[sName]||STUDENT_SCHOOLS[sName];
                let rng=null;
                if(school){
                  const kNew=`${school}_${activeGrade}`;
                  rng=jhTestRanges[kNew];
                  if(!rng){
                    const oldKeys=Object.keys(jhTestRanges).filter(k=>k.startsWith(`${school}_${activeGrade}_`));
                    if(oldKeys.length>0){
                      const sorted=oldKeys.sort((a,b)=>{
                        const da=jhTestRanges[a]?.updatedAt||'';
                        const db=jhTestRanges[b]?.updatedAt||'';
                        return db.localeCompare(da);
                      });
                      rng=jhTestRanges[sorted[0]];
                    }
                  }
                }
                // 生徒のテキストタイプを判定（X生 or Y生）
                const tKey0=jhTextbookKey(jhSi,activeSubj)||'';
                const isXType=tKey0.includes('X_');
                const isFirst=(activeSubj==='数学'||activeSubj==='算数');
                // X生・Y生で範囲を別々に取得
                let rangeStartId='', rangeEndId='';
                if(rng){
                  if(isXType){
                    // X生：xMath/xEng系を優先
                    rangeStartId=isFirst?(rng.xMathStart||''):(rng.xEngStart||'');
                    rangeEndId=isFirst?(rng.xMathEnd||''):(rng.xEngEnd||'');
                  }else{
                    // Y生：yMath/yEng → 旧形式 mathStart/engStart の順
                    rangeStartId=isFirst?(rng.yMathStart||rng.mathStart||''):(rng.yEngStart||rng.engStart||'');
                    rangeEndId=isFirst?(rng.yMathEnd||rng.mathEnd||''):(rng.yEngEnd||rng.engEnd||'');
                  }
                }
                // v94: タブ廃止。全チャンクの単元を1本に展開し、単元番号（IDの末尾数字）順＝単元管理表の順で表示。
                //   記録キー（科目_単元ID）は不変なので保存・表示データへの影響ゼロ。
                const flatItems=jhChapters.flatMap(ch=>(ch.items||[]).map(it=>({...it,__chap:ch.name})));
                // v96: 並び順はCHAPTERSのデータ順（＝単元管理表＝テキストの順番）をそのまま使用。
                //   v94のID末尾数字昇順ソートは「計算単元が固まり時計が後ろに飛ぶ」原因だったため廃止。
                //   CHAPTERSは各テキストを単元管理表の順で並べ直し済み。記録キー（科目_単元ID）は不変＝既存データへの影響ゼロ。
                const items=flatItems;
                const skKey=`${activeGrade}_${activeSubj}`;
                const skList=jhSkipItems[skKey]||[];
                const isSkipped=id=>skList.includes(id);
                const tKey=jhTextbookKey(jhSi,activeSubj);
                const tbSuf=((tKey&&tKey.match(/^[小中][1-6]([XYZW])_/))||[])[1]||'';
                const tbName=(TEXTBOOK_NAME[activeSubj]||{})[tbSuf]||'';
                const allItemsGlobal=(CHAPTERS[tKey]||[]).flatMap(c=>c.items);
                const globalIdxOf={};allItemsGlobal.forEach((x,gi)=>{globalIdxOf[x.id]=gi;});
                const globalStartIdx=rangeStartId?allItemsGlobal.findIndex(x=>x.id===rangeStartId):-1;
                const globalEndIdx=rangeEndId?allItemsGlobal.findIndex(x=>x.id===rangeEndId):-1;
                return(
                <div style={{background:'white',borderRadius:'10px',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
                  <div style={{padding:'8px 14px',background:SUBJECT_COLOR[activeSubj]||'#4f46e5',color:'white',fontWeight:'bold',fontSize:'14px'}}>
                    {activeSubj}{tbName?` ${tbName}`:''}・全{items.length}単元（テキスト順）
                  </div>
                  {items.map((it,idx)=>{
                    const r=jhGetRecord(jhSi,`${activeSubj}_${it.id}`);
                    const st=r.status;
                    const skipped=isSkipped(it.id);
                    let inRange=false;
                    if(globalStartIdx>=0&&globalEndIdx>=0){
                      const globalIdx=globalIdxOf[it.id]??-1;
                      inRange=globalIdx>=globalStartIdx&&globalIdx<=globalEndIdx;
                    }
                    const isStart=rangeStartId&&it.id===rangeStartId;
                    const isEnd=rangeEndId&&it.id===rangeEndId;
                    const rowBg=skipped?'#f3f4f6':isEnd?'#fff7ed':inRange?'#fefce8':st!=='未'?STATUS_BG[st]:'white';
                    const borderBottom=isEnd?'2px solid #f97316':'1px solid #f3f4f6';
                    return(
                      <React.Fragment key={it.id}>
                        {idx>0&&it.__chap!==items[idx-1].__chap&&(
                          <div style={{padding:'5px 12px',background:'#f1f5f9',borderTop:idx>0?'1px solid #e2e8f0':'none',fontSize:'11px',color:'#475569',fontWeight:'bold'}}>📂 {it.__chap}</div>
                        )}
                      <div style={{borderBottom,background:rowBg,opacity:skipped?0.65:1}}>
                        <div style={{display:'flex',alignItems:'center',gap:'8px',padding:'8px 12px'}}>
                          <span style={{color:'#9ca3af',fontSize:'11px',minWidth:'20px'}}>{idx+1}</span>

                            <span style={{minWidth:'44px',padding:'4px 8px',borderRadius:'6px',background:'#e5e7eb',color:'#9ca3af',fontWeight:'bold',fontSize:'13px',textAlign:'center'}}>—</span>
                          ):(
                            <button onClick={()=>jhCycleStatus(jhSi,`${activeSubj}_${it.id}`)}
                              style={{minWidth:'44px',padding:'4px 8px',borderRadius:'6px',border:'none',
                                background:STATUS_BG[st],color:STATUS_COLOR[st],fontWeight:'bold',fontSize:'13px',cursor:'pointer'}}>
                              {st}
                            </button>
                          )}
                          <div style={{flex:1,fontSize:'13px',display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}}>
                            {isEnd&&!skipped&&<span style={{background:'#f97316',color:'white',fontSize:'10px',fontWeight:'bold',borderRadius:'4px',padding:'1px 6px',whiteSpace:'nowrap'}}>🎯ゴール</span>}
                            {isStart&&!isEnd&&!skipped&&<span style={{background:'#3b82f6',color:'white',fontSize:'10px',fontWeight:'bold',borderRadius:'4px',padding:'1px 6px',whiteSpace:'nowrap'}}>📌スタート</span>}
                            {skipped&&<span style={{background:'#9ca3af',color:'white',fontSize:'10px',fontWeight:'bold',borderRadius:'4px',padding:'1px 6px',whiteSpace:'nowrap'}}>⏭ 飛ばして次へ</span>}
                            <span style={{color:skipped?'#9ca3af':'#1f2937',textDecoration:skipped?'line-through':'none'}}>{it.text}</span>
                          </div>
                          {!skipped&&st!=='未'&&r.teacher&&<span style={{fontSize:'10px',color:'#9ca3af',flexShrink:0}}>{r.teacher}{r.date?' · '+r.date:''}</span>}
                          <button onClick={()=>jhToggleSkip(activeGrade,activeSubj,it.id)}
                            title={skipped?'スキップ解除':'この単元をスキップ'}
                            style={{background:skipped?'#fee2e2':'#f3f4f6',color:skipped?'#dc2626':'#9ca3af',
                              border:'none',borderRadius:'4px',padding:'3px 8px',fontSize:'11px',cursor:'pointer',
                              fontWeight:skipped?'bold':'normal',flexShrink:0}}>
                            {skipped?'✕解除':'⏭'}
                          </button>
                        </div>
                      </div>
                      </React.Fragment>
                    );
                  })}
                </div>
                );
              })()}
              {activeSubj!=='練ゼミ'&&activeSubj!=='英単語'&&jhChapters.length===0&&<div style={{background:'white',borderRadius:'10px',padding:'24px',textAlign:'center',color:'#6b7280'}}><p>受講なし（{activeSubj}）</p></div>}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script>
<!-- v23: バージョンバッジ（B対策）と強制リロードボタン（D対策） -->
<div id="app-version-badge" class="app-version-badge" title="クリックで詳細表示"></div>
<button id="app-reload-btn" class="app-reload-btn" title="キャッシュをクリアして最新版を取得">🔄 最新版に更新</button>
<script>
  // v23: バージョンバッジに表示
  (function(){
    const badge=document.getElementById('app-version-badge');
    const btn=document.getElementById('app-reload-btn');
    if(badge){
      badge.textContent=`📱 ${window.__APP_VERSION__||'?'} (${window.__APP_BUILD_DATE__||'?'})`;
      badge.addEventListener('click',()=>{
        const msg=`明光義塾チェックアプリ\nバージョン: ${window.__APP_VERSION_FULL__||'?'}\nビルド日: ${window.__APP_BUILD_DATE__||'?'}\n\n表示が古いと感じたら「🔄 最新版に更新」ボタンを押してください。`;
        alert(msg);
      });
    }
    if(btn){
      btn.addEventListener('click',async()=>{
        if(!confirm('🔄 最新版に更新しますか？\n\n（保存中のデータがある場合は完了を待ってから実行してください。\n  キャッシュをクリアして最新版を再取得します）')) return;
        try{
          // ServiceWorkerをすべて削除
          if('serviceWorker' in navigator){
            const regs=await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r=>r.unregister()));
          }
          // Cache APIをすべて削除
          if('caches' in window){
            const names=await caches.keys();
            await Promise.all(names.map(n=>caches.delete(n)));
          }
          // localStorageのバージョン記録だけリセット（他のデータは保持）
          localStorage.removeItem('_meiko_app_version');
        }catch(e){console.error('Cache clear error:',e);}
        // URLにタイムスタンプ付きで強制リロード
        const url=new URL(window.location.href);
        url.searchParams.set('_force', Date.now());
        window.location.replace(url.toString());
      });
    }
  })();
</script>
</body>
