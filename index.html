// 講師選択画面
// ══════════════════════════════════════════
function TeacherSelectScreen({teachers,role,onSelect,onDelete,onAdd,bgLoading,bgProgress}){
  const [editMode,setEditMode]=useState(false);
  const [newName,setNewName]=useState('');
  const handleDel=(t)=>{
    if(window.confirm(`講師「${t}」を削除しますか？\n※この操作は取り消せません`)){
      onDelete(t);
    }
  };
  const handleAdd=()=>{
    const name=(newName||'').trim();
    if(!name){alert('講師名を入力してください');return;}
    if(teachers.includes(name)){alert('同じ名前の講師が既に登録されています');return;}
    onAdd(name);setNewName('');
  };
  return(
    <div style={{minHeight:'100vh',background:'#f0f4f8',padding:'24px 16px'}}>
      <div style={{maxWidth:'480px',margin:'0 auto'}}>
        <p style={{textAlign:'center',fontWeight:'bold',fontSize:'20px',color:'#1e3a8a',marginBottom:'6px'}}>👨‍🏫 講師を選択</p>
        <p style={{textAlign:'center',color:'#6b7280',fontSize:'13px',marginBottom:'16px'}}>{role==='director'?'🏫 教室長モード':'講師モード'}</p>
        {bgLoading&&(()=>{
            const pct=bgProgress&&bgProgress.total>0?Math.round(bgProgress.done/bgProgress.total*100):0;
            return(
              <div style={{marginBottom:'12px',padding:'10px 14px',background:'#fef3c7',borderRadius:'8px',border:'1px solid #fbbf24'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}}>
                  <span style={{fontSize:'12px',color:'#92400e',fontWeight:'bold'}}>⏳ 最新データ取得中...</span>
                  <span style={{fontSize:'11px',color:'#92400e',fontWeight:'bold'}}>{bgProgress?.done||0}/{bgProgress?.total||0} ({pct}%)</span>
                </div>
                <div style={{background:'#fde68a',borderRadius:'4px',height:'6px',overflow:'hidden'}}>
                  <div style={{width:`${pct}%`,height:'100%',background:'#d97706',transition:'width 0.3s'}}/>
                </div>
              </div>
            );
          })()}
        {role==='director'&&(
          <div style={{display:'flex',justifyContent:'center',marginBottom:'16px'}}>
            <button onClick={()=>setEditMode(!editMode)}
              style={{background:editMode?'#dc2626':'#f59e0b',color:'white',border:'none',borderRadius:'8px',padding:'8px 16px',fontSize:'13px',cursor:'pointer',fontWeight:'bold'}}>
              {editMode?'✕ 編集モード終了':'⚙ 講師リストを編集'}
            </button>
          </div>
        )}
        {editMode&&role==='director'&&(
          <div style={{background:'#fef3c7',border:'1px solid #fbbf24',borderRadius:'10px',padding:'12px',marginBottom:'16px'}}>
            <p style={{fontSize:'12px',color:'#78350f',marginBottom:'8px',fontWeight:'bold'}}>➕ 新しい講師を追加</p>
            <div style={{display:'flex',gap:'6px'}}>
              <input type="text" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="例：山田 太郎"
                onKeyDown={e=>e.key==='Enter'&&handleAdd()}
                style={{flex:1,border:'1px solid #d1d5db',borderRadius:'6px',padding:'6px 10px',fontSize:'13px'}}/>
              <button onClick={handleAdd} style={{background:'#065f46',color:'white',border:'none',borderRadius:'6px',padding:'6px 14px',fontSize:'13px',cursor:'pointer',fontWeight:'bold'}}>追加</button>
            </div>
            <p style={{fontSize:'11px',color:'#92400e',marginTop:'8px'}}>💡 各講師の右にある 🗑 ボタンで削除できます</p>
          </div>
        )}
        <div style={{display:'grid',gap:'8px'}}>
          {teachers.map((t,i)=>(
            <div key={i} style={{display:'flex',gap:'4px'}}>
              <button onClick={()=>!editMode&&onSelect(t)}
                style={{flex:1,background:'white',border:'2px solid #e5e7eb',borderRadius:'10px',padding:'14px 18px',fontSize:'15px',cursor:editMode?'default':'pointer',textAlign:'left',fontWeight:'bold',color:'#374151'}}>
                {t}
              </button>
              {editMode&&role==='director'&&(
                <button onClick={()=>handleDel(t)} title="この講師を削除"
                  style={{background:'#fee2e2',color:'#dc2626',border:'2px solid #fca5a5',borderRadius:'10px',padding:'0 14px',fontSize:'16px',cursor:'pointer',fontWeight:'bold'}}>
                  🗑
                </button>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════
// 生徒選択画面（小中高全員統合）
// ══════════════════════════════════════════
function StudentSelectScreen({hsStudents,jhStudents,teacherName,role,onStart,onBack,onSwitchToTeacher,bgLoading,bgProgress}){
  const [sel,setSel]=useState([]);
  const [filter,setFilter]=useState('all'); // 'all'|'hs'|'jh_chu'|'jh_sho'

  const tog=(name,type)=>{
    setSel(s=>{
      const exists=s.find(x=>x.name===name);
      return exists?s.filter(x=>x.name!==name):[...s,{name,type}];
    });
  };
  const isSel=name=>sel.some(x=>x.name===name);
  const gradeOf=name=>(name.match(/（(.+?)）/)||[])[1]||'';

  // v49: 紗耶佳先生のご要望「全員を一度に呼び出したい」
  //   教室長は「全員の進捗を俯瞰する」業務が圧倒的に多いため、
  //   1人ずつ選ぶのではなく、グループ単位で一括選択できるようにする
  const selectGroup=(groupType)=>{
    let picked=[];
    if(groupType==='hs'){
      picked=hsStudents.map(name=>({name,type:'hs'}));
    }else if(groupType==='chu'){
      // 中学生（中1・中2・中3、ただし中3・一貫は除く）
      picked=jhStudents.filter(s=>{const g=gradeOf(s);return g.startsWith('中')&&g!=='中3・一貫';})
        .map(name=>({name,type:'jh'}));
    }else if(groupType==='sho'){
      picked=jhStudents.filter(s=>gradeOf(s).startsWith('小'))
        .map(name=>({name,type:'jh'}));
    }else if(groupType==='all'){
      picked=[
        ...hsStudents.map(name=>({name,type:'hs'})),
        ...jhStudents.map(name=>({name,type:'jh'})),
      ];
    }
    setSel(picked);
  };
  const clearSel=()=>setSel([]);

  // 学年順（上の学年から）
  // v25: 「中3・一貫」を高校生グループの末尾に追加
  //   中高一貫生は中3だが高校カリキュラム（数学チャート式・英語ルート）を履修するため、
  //   システム的には「高校生」として扱い、表示上だけ「中3・一貫」と区別する。
  const HS_GRADE_ORDER = ['高3','高2','高1','中3・一貫'];
  const CHU_GRADE_ORDER = ['中3','中2','中1'];
  const SHO_GRADE_ORDER = ['小6','小5','小4','小3','小2','小1'];

  const groupBy=(list,orders)=>{
    const map={};
    orders.forEach(g=>{map[g]=[];});
    list.forEach(s=>{
      const g=gradeOf(s);
      if(map[g]) map[g].push(s);
    });
    return orders.map(g=>({grade:g,students:map[g]})).filter(x=>x.students.length>0);
  };

  const hsGroups  = groupBy(hsStudents, HS_GRADE_ORDER);
  const chuGroups = groupBy(jhStudents, CHU_GRADE_ORDER);
  const shoGroups = groupBy(jhStudents, SHO_GRADE_ORDER);

  const gradeColor=g=>{
    if(g.startsWith('高')) return '#1e3a8a';
    if(g.startsWith('中')) return '#065f46';
    return '#0891b2';
  };
  const gradeBg=g=>{
    if(g.startsWith('高')) return '#eff6ff';
    if(g.startsWith('中')) return '#ecfdf5';
    return '#f0f9ff';
  };
  const gradeBorder=g=>{
    if(g.startsWith('高')) return '#1e3a8a';
    if(g.startsWith('中')) return '#065f46';
    return '#0891b2';
  };

  const renderGroup=(groups,type)=>groups.map(({grade,students})=>(
    <div key={grade} style={{marginBottom:'12px'}}>
      <p style={{fontSize:'12px',fontWeight:'bold',color:gradeColor(grade),marginBottom:'5px',
        paddingLeft:'6px',borderLeft:`3px solid ${gradeColor(grade)}`}}>
        {grade}　{students.length}人
      </p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'5px'}}>
        {students.map((s,i)=>{
          const sel_=isSel(s);
          const gc=gradeColor(grade);
          return(
            <button key={i} onClick={()=>tog(s,type)}
              style={{padding:'7px 6px',borderRadius:'8px',
                border:`2px solid ${sel_?gc:'#e5e7eb'}`,
                background:sel_?gradeBg(grade):'white',cursor:'pointer',textAlign:'left',transition:'all .1s'}}>
              <div style={{fontWeight:sel_?'bold':'normal',fontSize:'12px',
                color:sel_?gc:'#374151',lineHeight:1.3}}>
                {sel_?'✓ ':''}{stripGrade(s)}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  ));

  const showHs  = filter==='all'||filter==='hs';
  const showChu = filter==='all'||filter==='jh_chu';
  const showSho = filter==='all'||filter==='jh_sho';

  return(
    <div style={{minHeight:'100vh',background:'#f0f4f8',padding:'12px'}}>
      <div style={{maxWidth:'680px',margin:'0 auto'}}>
        {/* ヘッダー */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
          <div>
            <p style={{fontWeight:'bold',fontSize:'17px',color:'#1e3a8a'}}>今日担当する生徒を選択</p>
            <p style={{color:'#6b7280',fontSize:'12px'}}>👨‍🏫 {teacherName}</p>
          </div>
          <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
            {role==='director'&&onSwitchToTeacher&&(
              <button onClick={onSwitchToTeacher}
                style={{background:'#059669',color:'white',border:'none',borderRadius:'8px',padding:'8px 14px',cursor:'pointer',fontSize:'12px',fontWeight:'bold',boxShadow:'0 1px 4px rgba(0,0,0,.15)'}}>
                🎓 講師モードへ
              </button>
            )}
            <button onClick={onBack} style={{background:'#e5e7eb',border:'none',borderRadius:'8px',padding:'8px 14px',cursor:'pointer',fontSize:'13px'}}>← 戻る</button>
          </div>
        </div>
        {bgLoading&&(()=>{
          const pct=bgProgress&&bgProgress.total>0?Math.round(bgProgress.done/bgProgress.total*100):0;
          return(
            <div style={{marginBottom:'12px',padding:'10px 14px',background:'#fef3c7',borderRadius:'8px',border:'1px solid #fbbf24'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}}>
                <span style={{fontSize:'12px',color:'#92400e',fontWeight:'bold'}}>⏳ 最新データ取得中...</span>
                <span style={{fontSize:'11px',color:'#92400e',fontWeight:'bold'}}>{bgProgress?.done||0}/{bgProgress?.total||0} ({pct}%)</span>
              </div>
              <div style={{background:'#fde68a',borderRadius:'4px',height:'6px',overflow:'hidden'}}>
                <div style={{width:`${pct}%`,height:'100%',background:'#d97706',transition:'width 0.3s'}}/>
              </div>
            </div>
          );
        })()}

        {/* フィルタータブ */}
        <div style={{display:'flex',gap:'6px',marginBottom:'14px',flexWrap:'wrap'}}>
          {[
            ['all',    '全員',    '#1e3a8a'],
            ['hs',     '📘 高校生','#1e3a8a'],
            ['jh_chu', '📗 中学生','#065f46'],
            ['jh_sho', '🔵 小学生','#0891b2'],
          ].map(([v,l,c])=>(
            <button key={v} onClick={()=>setFilter(v)}
              style={{padding:'6px 14px',borderRadius:'20px',border:'none',cursor:'pointer',fontSize:'13px',
                background:filter===v?c:'white',color:filter===v?'white':'#6b7280',
                fontWeight:filter===v?'bold':'normal',boxShadow:'0 1px 3px rgba(0,0,0,.1)'}}>
              {l}
            </button>
          ))}
          {sel.length>0&&(
            <span style={{marginLeft:'auto',alignSelf:'center',fontSize:'13px',color:'#1e3a8a',fontWeight:'bold',background:'#eff6ff',padding:'4px 10px',borderRadius:'20px'}}>
              {sel.length}人選択中
            </span>
          )}
        </div>

        {/* v49: 一括選択ボタン（紗耶佳先生のご要望：全員を一度に呼び出す） */}
        <div style={{background:'#fffbeb',border:'1px solid #fcd34d',borderRadius:'10px',padding:'10px 12px',marginBottom:'14px'}}>
          <p style={{fontSize:'11px',color:'#92400e',fontWeight:'bold',marginBottom:'7px'}}>
            ⚡ まとめて選択（全員の登録・進捗確認はこちら）
          </p>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
            <button onClick={()=>selectGroup('chu')}
              style={{flex:'1 1 auto',minWidth:'110px',padding:'9px 10px',borderRadius:'8px',border:'2px solid #065f46',
                background:'white',color:'#065f46',cursor:'pointer',fontSize:'12px',fontWeight:'bold'}}>
              📗 中学生 全員
            </button>
            <button onClick={()=>selectGroup('sho')}
              style={{flex:'1 1 auto',minWidth:'110px',padding:'9px 10px',borderRadius:'8px',border:'2px solid #0891b2',
                background:'white',color:'#0891b2',cursor:'pointer',fontSize:'12px',fontWeight:'bold'}}>
              🔵 小学生 全員
            </button>
            <button onClick={()=>selectGroup('hs')}
              style={{flex:'1 1 auto',minWidth:'110px',padding:'9px 10px',borderRadius:'8px',border:'2px solid #1e3a8a',
                background:'white',color:'#1e3a8a',cursor:'pointer',fontSize:'12px',fontWeight:'bold'}}>
              📘 高校生 全員
            </button>
            <button onClick={()=>selectGroup('all')}
              style={{flex:'1 1 auto',minWidth:'110px',padding:'9px 10px',borderRadius:'8px',border:'2px solid #b45309',
                background:'#b45309',color:'white',cursor:'pointer',fontSize:'12px',fontWeight:'bold'}}>
              🏫 教室 全員
            </button>
            {sel.length>0&&(
              <button onClick={clearSel}
                style={{flex:'0 0 auto',padding:'9px 12px',borderRadius:'8px',border:'1px solid #d1d5db',
                  background:'#f3f4f6',color:'#6b7280',cursor:'pointer',fontSize:'12px'}}>
                選択をクリア
              </button>
            )}
          </div>
        </div>

        {/* 高校生グループ */}
        {showHs&&hsGroups.length>0&&(
          <div style={{background:'white',borderRadius:'12px',padding:'12px',marginBottom:'12px',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
            <p style={{fontSize:'13px',fontWeight:'bold',color:'#1e3a8a',marginBottom:'10px'}}>📘 高校生</p>
            {renderGroup(hsGroups,'hs')}
          </div>
        )}

        {/* 中学生グループ */}
        {showChu&&chuGroups.length>0&&(
          <div style={{background:'white',borderRadius:'12px',padding:'12px',marginBottom:'12px',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
            <p style={{fontSize:'13px',fontWeight:'bold',color:'#065f46',marginBottom:'10px'}}>📗 中学生</p>
            {renderGroup(chuGroups,'jh')}
          </div>
        )}

        {/* 小学生グループ */}
        {showSho&&shoGroups.length>0&&(
          <div style={{background:'white',borderRadius:'12px',padding:'12px',marginBottom:'80px',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
            <p style={{fontSize:'13px',fontWeight:'bold',color:'#0891b2',marginBottom:'10px'}}>🔵 小学生</p>
            {renderGroup(shoGroups,'jh')}
          </div>
        )}

        {/* 開始ボタン（固定） */}
        <div style={{position:'fixed',bottom:'16px',left:'50%',transform:'translateX(-50%)',width:'calc(100% - 32px)',maxWidth:'680px',zIndex:10}}>
          <button onClick={()=>sel.length>0&&onStart(sel)} disabled={sel.length===0}
            style={{width:'100%',background:sel.length>0?'#1e3a8a':'#9ca3af',color:'white',border:'none',
              borderRadius:'12px',padding:'16px',fontWeight:'bold',fontSize:'16px',
              cursor:sel.length>0?'pointer':'not-allowed',boxShadow:'0 4px 16px rgba(0,0,0,.25)'}}>
            {sel.length>0?`▶ ${sel.length}人のデータを読み込む`:'生徒を選択してください'}
          </button>
        </div>
      </div>
    </div>
  );
}

function AddStudentForm({type,onAdd,onCancel}){
  const [name,setName]=useState('');
  const [grade,setGrade]=useState(type==='hs'?'高1':'中1');
  const [school,setSchool]=useState('');
  React.useEffect(()=>{
    // 学年に応じてデフォルト学校をセット
    const isElem=grade.startsWith('小');
    const list=SCHOOLS.filter(s=>isElem?s.endsWith('小'):s.endsWith('中'));
    if(list.length>0&&!list.includes(school)) setSchool(list[0]);
  },[grade]);
  // v25: 高校生として登録できる学年に「中3・一貫」を追加
  //   中高一貫生（中学3年で高校カリキュラム履修中の生徒）はここで登録する

    if(!name.trim()){alert('名前を入力してください');return;}

        {type==='jh'&&(
          <div>
            <p style={{fontSize:'11px',color:'#6b7280',marginBottom:'2px'}}>学校</p>
            <select value={school} onChange={e=>setSchool(e.target.value)}
              style={{width:'100%',border:'1px solid #d1d5db',borderRadius:'6px',padding:'6px 8px',fontSize:'13px',boxSizing:'border-box'}}>
              {SCHOOLS.filter(s=>grade.startsWith('小')?s.endsWith('小'):s.endsWith('中')).map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        )}
      </div>
      <div style={{display:'flex',gap:'6px'}}>
        <button onClick={submit}
          style={{flex:1,background:type==='hs'?'#1e3a8a':'#065f46',color:'white',border:'none',borderRadius:'6px',padding:'8px',fontSize:'13px',fontWeight:'bold',cursor:'pointer'}}>
          ✓ 追加する
        </button>
        <button onClick={onCancel}
          style={{flex:1,background:'#f3f4f6',color:'#6b7280',border:'none',borderRadius:'6px',padding:'8px',fontSize:'13px',cursor:'pointer'}}>
          キャンセル
        </button>
      </div>
    </div>
  );
}

// 進捗ダッシュボードタブ
function DashboardTab({students,allStudents,jhAllStudents,jhStudentIdxs,plans,hsRecords,hsEngAssign,hsEngRecords,jhRecords,jhRecordsByName,jhTextbookOverrides,jhTextbookOverridesByName,jhSchoolOverrides}){
  const [filter,setFilter]=useState('all'); // 'all','hs','jh','danger'
  const [sortBy,setSortBy]=useState('progress'); // 'name','progress','update'
  const [searchText,setSearchText]=useState('');
  const [reportData,setReportData]=useState(null); // 個人レポート表示中の生徒データ

  // 高校生の進捗データを計算
  const computeHsData=(stuName)=>{
    const n=stripGrade(stuName);
    const plan=migratePlan(plans[n]||{});
    const rmap=plan.roadmap||[];
    const recs=hsRecords[n]||{};
    const engRecs=hsEngRecords[n]||{};
    const skipItems=plan.skipItems||[];
    if(rmap.length===0) return {name:n,type:'hs',hasData:false,steps:[],pct:0,curStep:null,lastUpdate:null,danger:'none'};
    // 各ステップの進捗
    const steps=rmap.map((step,si)=>{
      let total=0,done=0;
      if(step.kind==='eng'){
        const es=ENG_SETS[step.engSet];
        if(es){
          const eFrom=step.engRange?.from||1, eTo=step.engRange?.to||999;
          getChaps(es.dataKey).forEach((ch,ci)=>{
            if(ci+1<eFrom||ci+1>eTo) return;
            ch.items.forEach(it=>{total++; if((engRecs[it.id]||{}).status==='◯') done++;});
          });
        }
        return {idx:si,kind:'eng',label:es?.short||'英',total,done,pct:total>0?Math.round(done/total*100):0,deadline:step.deadline};
      }else{
        const ss=SETS[step.textbookSet];
        if(!ss) return {idx:si,kind:'math',label:'?',total:0,done:0,pct:0,deadline:step.deadline};
        const skipSet=new Set(skipItems);
        const lv=step.maxLevel||5;
        const nFrom=step.nyumonRange?.from||1,nTo=step.nyumonRange?.to||999;
        const cFrom=step.chartRange?.from||1,cTo=step.chartRange?.to||999;
        getNyumon(ss.nyumon||'ia').forEach((ch,ci)=>{
          if(ci+1<nFrom||ci+1>nTo) return;
          ch.items.forEach(it=>{if(skipSet.has(`IA_${it.id}`)) return; total++; if((recs[`IA_${it.id}`]||{}).status==='◯') done++;});
        });
        getChaps(ss.dataKey).forEach((ch,ci)=>{
          if(ci+1<cFrom||ci+1>cTo) return;
          ch.items.forEach(it=>{if((it.level||1)>lv||skipSet.has(`CHART_${it.id}`)) return; total++; if((recs[`CHART_${it.id}`]||{}).status==='◯') done++;});
        });
        return {idx:si,kind:'math',label:ss.short,total,done,pct:total>0?Math.round(done/total*100):0,deadline:step.deadline};
      }
    });
    // 全体進捗
    const allTotal=steps.reduce((s,x)=>s+x.total,0);
    const allDone=steps.reduce((s,x)=>s+x.done,0);
    const pct=allTotal>0?Math.round(allDone/allTotal*100):0;
    // 最終更新（recordsから推定）
    const allRecs={...recs,...engRecs};
    const updateDates=Object.values(allRecs).map(r=>r?.updatedAt).filter(Boolean).map(d=>new Date(d));
    const lastUpdate=updateDates.length>0?new Date(Math.max(...updateDates.map(d=>d.getTime()))):null;
    // 危険度判定：期限切れ近 or 長期未更新
    let danger='none';
    const today=new Date();
    if(lastUpdate){
      const daysSinceUpdate=Math.floor((today-lastUpdate)/86400000);
      if(daysSinceUpdate>=14) danger='red';
      else if(daysSinceUpdate>=7) danger='yellow';
    }else{
      danger='red';
    }
    // 期限間近で進捗低い
    steps.forEach(s=>{
      if(s.deadline){
        const ddl=new Date(s.deadline);
        const remDays=Math.ceil((ddl-today)/86400000);
        if(remDays>=0&&remDays<=7&&s.pct<70){danger='red';}
        else if(remDays>=0&&remDays<=14&&s.pct<50&&danger==='none'){danger='yellow';}
      }
    });
    return {name:n,type:'hs',hasData:true,steps,pct,curStep:steps[0],lastUpdate,danger,allTotal,allDone};
  };

  // 小中学生の進捗データを計算
  const computeJhData=(fullName)=>{
    const n=stripGrade(fullName);
    const grade=extractGrade(fullName);
    const subjects=GRADE_SUBJECTS[grade]||[];
    let total=0,done=0;
    let lastUpdate=null;
    const subjectStats=[];
    // v48: index非依存。すべて「生徒名（n）」で引く
    //   旧バグ: jhTextbookOverrides[si] / jhRecords[si] と index で引いていたが、
    //          Reactのstate配列とGASのstudents配列のindexがズレると別人の設定を見てしまい
    //          田村くんの進捗が0%表示されていた
    //   修正: jhTextbookOverridesByName[n] / jhRecordsByName[n] で生徒名ベースに統一
    const ovByName=(jhTextbookOverridesByName||{})[n]||{};
    const studentRecords=(jhRecordsByName||{})[n]||{};
    subjects.forEach(subj=>{
      const override=ovByName[subj];
      const defaultKey=(grade.startsWith('中')||grade.startsWith('小'))?`${grade}Y_${subj}`:`${grade}_${subj}`;
      const rawKey=override||defaultKey;
      if(rawKey&&rawKey.startsWith('none_')) return;
      const chs=CHAPTERS[rawKey]||[];
      let st=0,sd=0;
      // v50: 紗耶佳先生のご要望「最新の単元」を計算
      //   ◯△☓のどれかがついた中で、章の並び順で一番後ろの単元 = 今取り組んでいる単元
      //   割合より「どの単元まで来たか」がテスト範囲照合に直結する
      let latestUnit=null;       // {text,status} 最新の単元
      // v51: 教科ごとの最終チェック日（その教科で最後に記録した日）
      let subjLastDate=null;
      const allItemsFlat=[];
      chs.forEach(ch=>ch.items.forEach(it=>allItemsFlat.push(it)));
      allItemsFlat.forEach((it,itemOrder)=>{
        st++;
        // v48: 講師画面と同じキー形式 `${教科}_${項目id}` で生徒名ベースのrecordsから取得
        const r=studentRecords[`${subj}_${it.id}`]||{};
        if(r.status==='◯') sd++;
        // v50: ◯△☓のどれかがついていれば「着手済み」。並び順が後ろのものを最新とする
        if(r.status==='◯'||r.status==='△'||r.status==='☓'){
          // itemOrder が大きいほど後ろの単元 → 最新
          latestUnit={text:it.text,status:r.status,order:itemOrder};
        }
        // v52: 日付フィールドは "date"（jhCycleStatusが {status,teacher,date} で保存）
        //   旧バグ: updatedAt を見ていたが、実データは date フィールド → 日付が出なかった
        const dateStr=r.date||r.updatedAt; // 後方互換で updatedAt もフォールバック
        if(dateStr){
          const d=new Date(dateStr);
          if(!isNaN(d.getTime())){
            if(!subjLastDate||d>subjLastDate) subjLastDate=d;
            if(!lastUpdate||d>lastUpdate) lastUpdate=d;
          }
        }
      });
      subjectStats.push({
        subj,total:st,done:sd,pct:st>0?Math.round(sd/st*100):0,
        latestUnit,                // v50: {text,status,order} or null
        textbookKey:rawKey,        // v50: レポート表示で全単元を引くのに使う
        subjLastDate               // v51: その教科の最終チェック日 or null
      });
      total+=st; done+=sd;
    });
    const pct=total>0?Math.round(done/total*100):0;
    let danger='none';
    if(!lastUpdate) danger='red';
    else{
      const today=new Date();
      const daysSinceUpdate=Math.floor((today-lastUpdate)/86400000);
      if(daysSinceUpdate>=14) danger='red';
      else if(daysSinceUpdate>=7) danger='yellow';
    }
    return {name:n,fullName,type:'jh',grade,subjectStats,pct,total,done,lastUpdate,danger,school:jhSchoolOverrides[n]||STUDENT_SCHOOLS[n]||'',jhStudentRecords:studentRecords};
  };

  // 全データ計算
  // v82: jhStudentIdxs(インデックス配列)ではなくjhAllStudents(名前リスト)を直接使用
  // 理由：生徒削除後にインデックスがずれると別の生徒のデータを参照するバグがある
  const allData=[
    ...students.map(s=>computeHsData(s)),
    ...(jhAllStudents||[]).filter(Boolean).map(s=>computeJhData(s))
  ];

  // フィルタ＆ソート
  let filteredData=allData.filter(d=>{
    if(filter==='hs'&&d.type!=='hs') return false;
    if(filter==='jh'&&d.type!=='jh') return false;
    if(filter==='danger'&&d.danger==='none') return false;
    if(searchText&&!d.name.includes(searchText)) return false;
    return true;
  });
  // v52: 学年順ソート用の順序定義（上の学年から）
  //   紗耶佳先生のご要望：名前順より学年順の方が業務で使う
  const GRADE_SORT_ORDER=['高3','高2','高1','中3・一貫','中3','中2','中1','小6','小5','小4','小3','小2','小1'];
  const gradeRank=d=>{
    const g=d.type==='hs'?(d.grade||'高1'):(d.grade||'');
    const idx=GRADE_SORT_ORDER.indexOf(g);
    return idx<0?999:idx;
  };
  filteredData.sort((a,b)=>{
    if(sortBy==='grade'){
      // 学年順（上の学年から）→ 同学年なら名前順
      const r=gradeRank(a)-gradeRank(b);
      return r!==0?r:a.name.localeCompare(b.name);
    }
    if(sortBy==='progress') return a.pct-b.pct; // 進捗低い順（危険な順）
    if(sortBy==='update'){
      const aT=a.lastUpdate?a.lastUpdate.getTime():0;
      const bT=b.lastUpdate?b.lastUpdate.getTime():0;
      return aT-bT; // 古い順
    }
    return 0;
  });

  // 集計
  const stats={
    total:allData.length,
    danger:allData.filter(d=>d.danger==='red').length,
    warning:allData.filter(d=>d.danger==='yellow').length,
    safe:allData.filter(d=>d.danger==='none').length,
  };

  // CSV出力
  const exportCSV=()=>{
    const rows=[['生徒名','種別','最新の単元','危険度','最終チェック']];
    allData.forEach(d=>{
      // v50: 小中学生は「教科：状態 単元名」を出力
      const curLabel=d.type==='hs'
        ?(d.steps?.map(s=>`${s.label}:${s.pct}%`).join(' ')||'-')
        :(d.subjectStats?.map(s=>s.latestUnit?`${s.subj}:${s.latestUnit.status}${s.latestUnit.text}`:`${s.subj}:未着手`).join(' / ')||'-');
      const dangerLabel={'red':'🔴危険','yellow':'🟡注意','none':'🟢良好'}[d.danger];
      const updStr=d.lastUpdate?d.lastUpdate.toLocaleDateString('ja-JP'):'未記録';
      rows.push([d.name,d.type==='hs'?'高校生':d.grade||'小中',curLabel,dangerLabel,updStr]);
    });
    const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`進捗一覧_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return(
    <div style={{background:'white',borderRadius:'12px',padding:'20px',boxShadow:'0 2px 8px rgba(0,0,0,0.05)'}}>
      {/* ヘッダー */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px',flexWrap:'wrap',gap:'8px'}}>
        <div>
          <p style={{fontSize:'18px',fontWeight:'bold',color:'#1e3a8a'}}>📊 進捗ダッシュボード</p>
          <p style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>全生徒の進捗状況を一覧で確認</p>
        </div>
        <button onClick={exportCSV}
          style={{background:'#059669',color:'white',border:'none',borderRadius:'8px',padding:'8px 14px',fontSize:'12px',cursor:'pointer',fontWeight:'bold'}}>
          📥 CSV出力
        </button>
      </div>

      {/* 統計サマリー */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'8px',marginBottom:'16px'}}>
        <div style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:'8px',padding:'10px',textAlign:'center'}}>
          <p style={{fontSize:'10px',color:'#6b7280'}}>登録生徒数</p>
          <p style={{fontSize:'24px',fontWeight:'bold',color:'#1e3a8a'}}>{stats.total}</p>
        </div>
        <div style={{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'8px',padding:'10px',textAlign:'center'}}>
          <p style={{fontSize:'10px',color:'#6b7280'}}>🔴 危険</p>
          <p style={{fontSize:'24px',fontWeight:'bold',color:'#dc2626'}}>{stats.danger}</p>
        </div>
        <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:'8px',padding:'10px',textAlign:'center'}}>
          <p style={{fontSize:'10px',color:'#6b7280'}}>🟡 注意</p>
          <p style={{fontSize:'24px',fontWeight:'bold',color:'#d97706'}}>{stats.warning}</p>
        </div>
        <div style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:'8px',padding:'10px',textAlign:'center'}}>
          <p style={{fontSize:'10px',color:'#6b7280'}}>🟢 良好</p>
          <p style={{fontSize:'24px',fontWeight:'bold',color:'#059669'}}>{stats.safe}</p>
        </div>
      </div>

      {/* フィルタ */}
      <div style={{display:'flex',gap:'6px',marginBottom:'12px',flexWrap:'wrap'}}>
        <input type="text" placeholder="🔍 生徒名検索" value={searchText} onChange={e=>setSearchText(e.target.value)}
          style={{flex:1,minWidth:'150px',border:'1px solid #d1d5db',borderRadius:'6px',padding:'6px 10px',fontSize:'12px'}}/>
        <select value={filter} onChange={e=>setFilter(e.target.value)}
          style={{border:'1px solid #d1d5db',borderRadius:'6px',padding:'6px 10px',fontSize:'12px'}}>
          <option value="all">全員</option>
          <option value="hs">高校生のみ</option>
          <option value="jh">小中学生のみ</option>
          <option value="danger">危険・注意のみ</option>
        </select>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
          style={{border:'1px solid #d1d5db',borderRadius:'6px',padding:'6px 10px',fontSize:'12px'}}>
          <option value="progress">進捗が低い順</option>
          <option value="update">更新が古い順</option>
          <option value="grade">学年順（高3→小1）</option>
        </select>
      </div>

      {/* 一覧 */}
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'12px'}}>
          <thead>
            <tr style={{background:'#f3f4f6'}}>
              <th style={{padding:'8px',textAlign:'left',borderBottom:'2px solid #d1d5db'}}>生徒名</th>
              <th style={{padding:'8px',textAlign:'center',borderBottom:'2px solid #d1d5db'}}>種別</th>
              {/* v50: 「現在の状況」を最新単元ベースに（紗耶佳先生のご要望） */}
              <th style={{padding:'8px',textAlign:'left',borderBottom:'2px solid #d1d5db'}}>最新の単元（数学・英語 ／ 高校生は進捗）</th>
              <th style={{padding:'8px',textAlign:'center',borderBottom:'2px solid #d1d5db',width:'70px'}}>危険度</th>
              <th style={{padding:'8px',textAlign:'center',borderBottom:'2px solid #d1d5db',width:'90px'}}>最終チェック</th>
              <th style={{padding:'8px',textAlign:'center',borderBottom:'2px solid #d1d5db',width:'80px'}}>レポート</th>
            </tr>
          </thead>
          <tbody>
            {filteredData.length===0&&(
              <tr><td colSpan="6" style={{padding:'40px',textAlign:'center',color:'#9ca3af'}}>該当する生徒がいません</td></tr>
            )}
            {filteredData.map((d,i)=>{
              const dangerColor={'red':'#fef2f2','yellow':'#fffbeb','none':'white'}[d.danger];
              const dangerIcon={'red':'🔴','yellow':'🟡','none':'🟢'}[d.danger];
              const updStr=d.lastUpdate?(()=>{
                const days=Math.floor((new Date()-d.lastUpdate)/86400000);
                if(days===0) return '今日';
                if(days===1) return '昨日';
                return `${days}日前`;
              })():'未記録';
              return(
                <tr key={i} style={{background:dangerColor,borderBottom:'1px solid #f3f4f6'}}>
                  <td style={{padding:'8px',fontWeight:'bold'}}>{d.name}</td>
                  <td style={{padding:'8px',textAlign:'center',fontSize:'10px'}}>{d.type==='hs'?'高校生':d.grade}</td>
                  <td style={{padding:'8px'}}>
                    {d.type==='hs'?(
                      // 高校生は従来通り進捗％タグ
                      d.steps&&d.steps.length>0?(
                        <div style={{display:'flex',gap:'3px',flexWrap:'wrap'}}>
                          {d.steps.map((s,si)=>(
                            <span key={si} style={{padding:'2px 6px',background:s.kind==='eng'?'#f5f3ff':'#eff6ff',color:s.kind==='eng'?'#7c3aed':'#1e3a8a',borderRadius:'10px',fontSize:'10px',fontWeight:'bold'}}>
                              {s.label} {s.pct}%
                            </span>
                          ))}
                        </div>
                      ):<span style={{color:'#9ca3af',fontSize:'11px'}}>未登録</span>
                    ):(
                      // v50: 小中学生は「最新の単元」を教科ごとに表示（紗耶佳先生のご要望）
                      // v51: 教科ごとに最終チェック日も単元の横に表示
                      d.subjectStats&&d.subjectStats.length>0?(
                        <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
                          {d.subjectStats.map((s,si)=>{
                            const statusColor={'◯':'#16a34a','△':'#d97706','☓':'#dc2626'}[s.latestUnit?.status]||'#9ca3af';
                            const statusBg={'◯':'#f0fdf4','△':'#fffbeb','☓':'#fef2f2'}[s.latestUnit?.status]||'#f3f4f6';
                            // v51: その教科の最終チェック日（○月○日 形式）
                            const dateStr=s.subjLastDate
                              ?`${s.subjLastDate.getMonth()+1}月${s.subjLastDate.getDate()}日`
                              :null;
                            return(
                              <div key={si} style={{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}}>
                                <span style={{fontSize:'10px',fontWeight:'bold',color:'#374151',width:'32px',flexShrink:0}}>{s.subj}</span>
                                {s.latestUnit?(
                                  <span style={{padding:'2px 8px',background:statusBg,color:statusColor,borderRadius:'6px',fontSize:'11px',fontWeight:'bold',border:`1px solid ${statusColor}`}}>
                                    {s.latestUnit.status} {s.latestUnit.text}
                                  </span>
                                ):(
                                  <span style={{color:'#9ca3af',fontSize:'10px'}}>未着手</span>
                                )}
                                {dateStr&&(
                                  <span style={{fontSize:'10px',color:'#6b7280'}}>最終チェック：{dateStr}</span>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      ):<span style={{color:'#9ca3af',fontSize:'11px'}}>未登録</span>
                    )}
                  </td>
                  <td style={{padding:'8px',textAlign:'center',fontSize:'14px'}}>{dangerIcon}</td>
                  <td style={{padding:'8px',textAlign:'center',fontSize:'10px',color:d.danger==='red'?'#dc2626':'#6b7280'}}>{updStr}</td>
                  <td style={{padding:'8px',textAlign:'center'}}>
                    <button onClick={()=>setReportData(d)}
                      style={{background:'#1e3a8a',color:'white',border:'none',borderRadius:'4px',padding:'4px 8px',fontSize:'10px',cursor:'pointer'}}>
                      📄 表示
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <p style={{fontSize:'10px',color:'#9ca3af',marginTop:'10px',textAlign:'right'}}>
        ※ 危険度判定：14日以上更新なし or 期限7日以内かつ進捗70%未満 → 🔴 / 7日以上更新なし or 期限14日以内かつ進捗50%未満 → 🟡
      </p>

      {/* 個人レポートモーダル */}
      {reportData&&<StudentReport data={reportData} onClose={()=>setReportData(null)}/>}
    </div>
  );
}

// 個人レポート表示コンポーネント
function StudentReport({data,onClose}){
  const today=new Date().toLocaleDateString('ja-JP');
  const printReport=()=>{
    window.print();
  };
  const dangerLabel={'red':'🔴 要注意','yellow':'🟡 注意','none':'🟢 良好'}[data.danger];
  const dangerColor={'red':'#dc2626','yellow':'#d97706','none':'#059669'}[data.danger];

  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:'12px'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'12px',padding:'24px',maxWidth:'700px',width:'100%',maxHeight:'90vh',overflow:'auto'}}>
        {/* ヘッダー（印刷時非表示） */}
        <div className="no-print" style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}}>
          <p style={{fontSize:'12px',color:'#6b7280'}}>個人進捗レポート</p>
          <div style={{display:'flex',gap:'6px'}}>
            <button onClick={printReport} style={{background:'#059669',color:'white',border:'none',borderRadius:'6px',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontWeight:'bold'}}>🖨️ 印刷</button>
            <button onClick={onClose} style={{background:'#f3f4f6',color:'#6b7280',border:'none',borderRadius:'6px',padding:'6px 12px',fontSize:'12px',cursor:'pointer'}}>閉じる</button>
          </div>
        </div>

        {/* レポート本体 */}
        <div id="report-content" style={{borderTop:'2px solid #1e3a8a',paddingTop:'16px'}}>
          <div style={{textAlign:'center',marginBottom:'20px'}}>
            <p style={{fontSize:'10px',color:'#6b7280'}}>{CLASSROOM_CONFIG.name} 進捗レポート</p>
            <p style={{fontSize:'20px',fontWeight:'bold',color:'#1e3a8a',marginTop:'4px'}}>{data.name} さん</p>
            <p style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>{today} 時点</p>
          </div>

          {/* サマリー */}

                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>

                      </p>
                      <p style={{fontSize:'11px',color:'#6b7280'}}>◯ {s.done}/{s.total}</p>
                    </div>
                    {/* 全単元リスト */}
                    <div style={{display:'flex',flexDirection:'column',gap:'2px'}}>
                      {chs.map((ch,ci)=>(
                        <div key={ci}>

                          {ch.items.map((it,ii)=>{

                            const st=r.status||'未';
                            const stColor={'◯':'#16a34a','△':'#d97706','☓':'#dc2626','未':'#d1d5db'}[st];
                            const stBg={'◯':'#f0fdf4','△':'#fffbeb','☓':'#fef2f2','未':'#f9fafb'}[st];

                                <span style={{fontSize:'11px',color:'#374151'}}>{it.text}</span>
                                {/* v52: 日付フィールドは date（checkedAtではない） */}
                                {(r.date||r.checkedAt)&&<span style={{fontSize:'9px',color:'#9ca3af',marginLeft:'auto'}}>{r.date||r.checkedAt}</span>}

          <div style={{marginTop:'20px',padding:'14px',background:'#f0fdf4',border:'1px dashed #86efac',borderRadius:'8px'}}>

              　　　　　　　　　　　　　　　　　　　　　　　　　　　<br/>
              　　　　　　　　　　　　　　　　　　　　　　　　　　　<br/>
              　　　　　　　　　　　　　　　　　　　　　　　　　　　
            </p>

          {/* フッター */}
          <div style={{borderTop:'1px solid #e5e7eb',marginTop:'20px',paddingTop:'10px',textAlign:'center'}}>
            <p style={{fontSize:'10px',color:'#9ca3af'}}>{CLASSROOM_CONFIG.name}　TEL: {CLASSROOM_CONFIG.tel}</p>
          </div>
        </div>
      </div>

      {/* 印刷用CSS */}
      <style>{`
        @media print {
          body * { visibility: hidden; }
          #report-content, #report-content * { visibility: visible; }
          #report-content { position: absolute; left: 0; top: 0; width: 100%; }
          .no-print { display: none !important; }

  );
}

function DirectorSetting({studentIdxs,allStudents,jhStudentIdxs,jhAllStudents,jhTextbookOverrides,jhTestRanges,jhDirectives,jhSchoolOverrides,jhSaveSchool,jhRenzemiAssign,jhSaveRenzemiAssign,jhRenzemiProgress,jhRenzemiDeadlines,jhSaveRenzemiDeadline,jhVocabAssign,jhSaveVocabAssign,jhVocabProgress,jhVocabHalf,jhVocabPassRate,jhVocabPassRateByName,jhSaveVocabHalf,jhSaveVocabPassRate,jhSaveVocabPassRateByName,currentTerm,jhSaveCurrentTerm,hsRecords,hsEngAssign,hsEngRecords,jhRecords,jhRecordsByName,jhSchoolGradeMaster,jhStudentDirectives,jhSaveStudentDirective,onAddJhStudent,onDelJhStudent,onAddHsStudent,onAddTeacher,onSaveTextbook,onSaveTestRange,onSaveDirective,onBack,saveMsg,saveMsgType}){
  const [plans,setPlans]=useState({});
  const [curIdx,setCurIdx]=useState(0);
  // v74: 教室長設定の未保存追跡。生徒切替時の警告と一括保存に使う。
  const [dirtyNames,setDirtyNames]=useState(()=>new Set());
  const markDirty=()=>{
    setDirtyNames(prev=>{
      // curNameは編集時点で確定しているはずだがガード
      const nm=stripGrade(students[curIdx]||'');
      if(!nm||prev.has(nm)) return prev;
      const n=new Set(prev); n.add(nm); return n;
    });
  };
  const clearDirty=(nm)=>{
    setDirtyNames(prev=>{
      if(!prev.has(nm)) return prev;
      const n=new Set(prev); n.delete(nm); return n;
    });
  };
  const [msg,setMsg]=useState('');
  const [tab,setTab]=useState('text');
  const [stList,setStList]=useState([]);
  const [tcList,setTcList]=useState([]);
  const [delMsg,setDelMsg]=useState('');
  // 絞り込み・宿題量タブ：対象ロードマップステップ
  const [rangeStepIdx,setRangeStepIdx]=useState(0);
  // 学校情報取得（カスタム > デフォルト）
  const getSchoolOf=name=>(jhSchoolOverrides||{})[name]||STUDENT_SCHOOLS[name]||'';
  // 学校保存ラッパー：保存中表示
  const saveSchoolWithFeedback=async(name,school)=>{
    setSavingSchool(name);
    try{
      await jhSaveSchool(name,school);
    }finally{
      setSavingSchool('');
    }
  };
  // 生徒・講師の追加用state
  const [showAddHs,setShowAddHs]=useState(false);
  const [showAddJh,setShowAddJh]=useState(false);
  const [showAddTc,setShowAddTc]=useState(false);
  // 学校変更ダイアログ
  const [editSchoolName,setEditSchoolName]=useState('');
  const [savingSchool,setSavingSchool]=useState('');
  const [showRenzemiOverview,setShowRenzemiOverview]=useState(false);
  const [showVocabOverview,setShowVocabOverview]=useState(false); // v101 英単語ダッシュボード
  // v17: 練ゼミ期限編集モーダル
  const [showRenzemiDeadlineModal,setShowRenzemiDeadlineModal]=useState(false);
  // 高校生設定の数学・英語タブ切替
  const [subjectTab,setSubjectTab]=useState('math'); // 'math' | 'eng'
  // 小中学生設定タブ用
  const [jhCurIdx,setJhCurIdx]=useState(0);
  const [jhShowTextbookModal,setJhShowTextbookModal]=useState(false);
  const [jhShowTestRangeModal,setJhShowTestRangeModal]=useState(false);
  const [jhShowDirectiveModal,setJhShowDirectiveModal]=useState(false);

  const students=studentIdxs.map(i=>allStudents[i]).filter(Boolean);
  // v48: textbookOverrides を「生徒名キー」に変換（進捗ダッシュボードのindexズレ対策）
  //   jhTextbookOverrides のキーは index だが、index は state とGASでズレうる
  //   生徒名キーに変換すれば index に一切依存せず確実に引ける
  const jhTextbookOverridesByName=React.useMemo(()=>{
    const byName={};
    Object.entries(jhTextbookOverrides||{}).forEach(([k,v])=>{
      const idx=parseInt(k);
      const fullName=(jhAllStudents||[])[idx];
      if(fullName){
        byName[stripGrade(fullName)]=v;
      }
    });
    return byName;
  },[jhTextbookOverrides,jhAllStudents]);
  const curName=stripGrade(students[curIdx]||'');
  // 旧形式とロードマップ両対応：curPlanFull がplan全体、curPlan は現在編集中ステップ（互換のため）
  const curPlanFull=migratePlan(plans[curName]||{});
  const curRoadmap=curPlanFull.roadmap||[];
  const safeRangeIdx=Math.min(rangeStepIdx,Math.max(0,curRoadmap.length-1));
  const curStep=curRoadmap[safeRangeIdx]||null;
  // ※「テキスト設定」タブはplan直下を参照、「絞り込み」タブはステップ参照
  // textタブで使うcurPlanはplans[curName]（互換のため）
  const curPlan=tab==='range'&&curStep?curStep:(plans[curName]||{});
  const hasJh=(jhStudentIdxs||[]).length>0;
  const hasHs=students.length>0;
  const noStudents=!hasHs&&!hasJh;

  useEffect(()=>{
    (async()=>{
      // v57: ロードマップ設定画面も getall で1回まとめ取得（約8.5秒1回）。
      //   成功 → plan/teachers/students を1回の結果から取り出す（追加通信ゼロ）
      //   失敗(null) → v56同様の並列8並行・個別取得にフォールバック（安全）
      const hsAll=await hsGetAll();
      if(hsAll){
        const p={};
        for(const s of students){
          const n=stripGrade(s);
          const d=hsPickFromAll(hsAll,`koukou:plan:${n}`,null);
          if(d) p[n]=d;
        }
        setPlans(p);
        setTcList(hsPickFromAll(hsAll,'koukou:teachers',ALL_TEACHERS_DEFAULT));
        setStList(hsPickFromAll(hsAll,'koukou:students',HS_STUDENTS_DEFAULT));
      }else{
        // フォールバック：v56と同じ並列8並行の個別取得
        const planKeys=students.map(s=>`koukou:plan:${stripGrade(s)}`);
        const got=await hsGetMany(planKeys,()=>null,8);
        const p={};
        for(const s of students){
          const n=stripGrade(s);
          const d=got[`koukou:plan:${n}`];
          if(d) p[n]=d;
        }
        setPlans(p);
        const [t,st]=await Promise.all([
          hsGet('koukou:teachers',ALL_TEACHERS_DEFAULT),
          hsGet('koukou:students',HS_STUDENTS_DEFAULT),
        ]);
        setTcList(t);setStList(st);
      }
    })();
  },[]);

  // setter：rangeタブの場合はロードマップステップを更新、textタブの場合はplan直下を更新
  const setF=(field,val)=>{
    setPlans(p=>{
      const cur=migratePlan(p[curName]||{});
      // rangeタブの絞り込み・日付・コンパスはステップに保存
      if(tab==='range'&&cur.roadmap&&cur.roadmap.length>0&&safeRangeIdx<cur.roadmap.length&&['textbookSet','maxLevel','startDate','deadline','nyumonRange','chartRange'].includes(field)){
        const newRoadmap=[...cur.roadmap];
        newRoadmap[safeRangeIdx]={...newRoadmap[safeRangeIdx],[field]:val};
        return {...p,[curName]:{...cur,roadmap:newRoadmap}};
      }
      // それ以外（memoなど）はplan直下に保存
      return {...p,[curName]:{...cur,[field]:val}};
    });
    markDirty(); // v74: 編集を未保存リストに記録
  };
  const setNR=(f,v)=>{
    setPlans(p=>{
      const cur=migratePlan(p[curName]||{});
      if(tab==='range'&&cur.roadmap&&cur.roadmap.length>0&&safeRangeIdx<cur.roadmap.length){
        const newRoadmap=[...cur.roadmap];
        const step=newRoadmap[safeRangeIdx]||{};
        newRoadmap[safeRangeIdx]={...step,nyumonRange:{...(step.nyumonRange||{}),[f]:v}};
        return {...p,[curName]:{...cur,roadmap:newRoadmap}};
      }
      return {...p,[curName]:{...cur,nyumonRange:{...(cur.nyumonRange||{}),[f]:v}}};
    });
    markDirty(); // v74
  };
  const setCR=(f,v)=>{
    setPlans(p=>{
      const cur=migratePlan(p[curName]||{});
      if(tab==='range'&&cur.roadmap&&cur.roadmap.length>0&&safeRangeIdx<cur.roadmap.length){
        const newRoadmap=[...cur.roadmap];
        const step=newRoadmap[safeRangeIdx]||{};
        newRoadmap[safeRangeIdx]={...step,chartRange:{...(step.chartRange||{}),[f]:v}};
        return {...p,[curName]:{...cur,roadmap:newRoadmap}};
      }
      return {...p,[curName]:{...cur,chartRange:{...(cur.chartRange||{}),[f]:v}}};
    });
    markDirty(); // v74
  };

  const save=async()=>{
    setMsg('保存中...');
    const p=plans[curName]||{};
    // 旧形式の値もroadmapに同期させる
    const migrated=migratePlan(p);
    await hsSet(`koukou:plan:${curName}`,migrated);
    setPlans(prev=>({...prev,[curName]:migrated}));
    clearDirty(curName); // v74: 保存成功で未保存リストから除去
    setMsg('✅ 保存しました');
    setTimeout(()=>setMsg(''),2000);
  };

  // v74: 未保存の全員を一括保存。1人ずつ順番にhsSetする（並列にしないのは安全のため）
  const saveAll=async()=>{
    const names=[...dirtyNames];
    if(names.length===0){ window.alert('未保存の生徒はいません。'); return; }
    if(!window.confirm(`未保存の${names.length}人を一括保存します。よろしいですか？`)) return;
    setMsg(`💾 ${names.length}人を保存中...`);
    let ok=0; const fail=[];
    for(const name of names){
      try{
        const migrated=migratePlan(plans[name]||{});
        await hsSet(`koukou:plan:${name}`,migrated);
        setPlans(prev=>({...prev,[name]:migrated}));
        ok++;
      }catch(e){
        console.error('[saveAll] 失敗',name,e);
        fail.push(name);
      }
    }
    setDirtyNames(prev=>{
      const n=new Set(prev);
      names.forEach(name=>{ if(!fail.includes(name)) n.delete(name); });
      return n;
    });
    if(fail.length===0){
      setMsg(`✅ ${ok}人を保存しました`);
    }else{
      setMsg(`⚠️ ${ok}人成功・${fail.length}人失敗（${fail.join('、')}）`);
    }
    setTimeout(()=>setMsg(''),5000);
  };

  // v74: 生徒切替時に未保存があれば確認ダイアログを出す
  const trySwitch=(i)=>{
    if(i===curIdx) return; // 同一は何もしない
    if(dirtyNames.has(curName)){
      const ok=window.confirm(`「${curName}」さんの編集が未保存です。\n\n・OK ＝ 切替する（編集はメモリには残るがタブを閉じると消えます。あとで「未保存を全員保存」ボタンで保存できます）\n・キャンセル ＝ この生徒のままにする`);
      if(!ok) return;
    }
    setCurIdx(i);
  };

  // v74: 戻る時にも未保存があれば確認
  const tryBack=()=>{
    if(dirtyNames.size>0){
      const ok=window.confirm(`未保存の編集が${dirtyNames.size}人ぶんあります（${[...dirtyNames].join('、')}）。\n\n・OK ＝ このまま戻る（編集はメモリには残るがタブを閉じると消えます）\n・キャンセル ＝ 戻らずヘッダーの「💾 未保存${dirtyNames.size}人を保存」ボタンから保存する`);
      if(!ok) return;
    }
    onBack();
  };

  // ロードマップ操作
  const getRoadmap=()=>{
    const mp=migratePlan(plans[curName]||{});
    return mp.roadmap||[];
  };
  const updateRoadmap=(newRoadmap)=>{
    const mp=migratePlan(plans[curName]||{});
    setPlans(p=>({...p,[curName]:{...mp,roadmap:newRoadmap}}));
    markDirty(); // v74
  };
  // 英文法ステップ追加
  const addRoadmapEngStep=(engSet)=>{
    const es=ENG_SETS[engSet];
    if(!es) return;
    const engLen=getChaps(es.dataKey).length;
    // v72: スマートデフォルト。直前の英語ステップの完了予定日があれば翌日から、無ければ今日から。
    //   完了予定日 = 開始日 + テキスト別の標準月数（肘井=4、大岩=5）。教室長が微調整する前提のデフォルト。
    const r=getRoadmap();
    const prevEng=[...r].reverse().find(s=>s.kind==='eng'&&s.deadline);
    const startDate=prevEng?addDaysToYmd(prevEng.deadline,1):_ymdLocal(new Date());
    const months=ROADMAP_DEFAULT_MONTHS[engSet]||4;
    const deadline=addMonthsToYmd(startDate,months);
    const newStep={
      kind:'eng',
      engSet,
      engRange:{from:1,to:engLen||99},
      startDate,
      deadline,
    };
    updateRoadmap([...r,newStep]);
  };

  const addRoadmapStep=(textbookSet)=>{
    const ts=SETS[textbookSet];
    if(!ts) return;
    const nyumonLen=getNyumon(ts.nyumon||'ia').length;
    const chartLen=getChaps(ts.dataKey).length;
    // v72: スマートデフォルト。直前の数学ステップの完了予定日があれば翌日から、無ければ今日から。
    //   完了予定日 = 開始日 + 11か月（入門精講＋チャート1冊分の標準）。
    const r=getRoadmap();
    const prevMath=[...r].reverse().find(s=>s.kind!=='eng'&&s.textbookSet&&s.deadline);
    const startDate=prevMath?addDaysToYmd(prevMath.deadline,1):_ymdLocal(new Date());
    const deadline=addMonthsToYmd(startDate,ROADMAP_DEFAULT_MONTHS.math);
    const newStep={
      textbookSet,
      maxLevel:5,
      nyumonRange:{from:1,to:nyumonLen||99},
      chartRange:{from:1,to:chartLen||99},
      startDate,
      deadline,
    };
    updateRoadmap([...r,newStep]);
  };
  const removeRoadmapStep=(idx)=>{
    if(!window.confirm('このテキストを削除しますか？')) return;
    const r=getRoadmap();
    updateRoadmap(r.filter((_,i)=>i!==idx));
  };
  const moveRoadmapStep=(idx,dir)=>{
    const r=[...getRoadmap()];
    const j=idx+dir;
    if(j<0||j>=r.length) return;
    [r[idx],r[j]]=[r[j],r[idx]];
    updateRoadmap(r);
  };
  const updateRoadmapStep=(idx,field,value)=>{
    const r=[...getRoadmap()];
    if(!r[idx]) return;
    r[idx]={...r[idx],[field]:value};
    updateRoadmap(r);
  };
  const updateRoadmapRange=(idx,rangeKey,field,value)=>{
    const r=[...getRoadmap()];
    if(!r[idx]) return;
    r[idx]={...r[idx],[rangeKey]:{...(r[idx][rangeKey]||{}),[field]:value}};
    updateRoadmap(r);
  };

  const hw = calcHomework(curPlan);
  const sel=curPlan.textbookSet;
  const selSet=sel?SETS[sel]:null;

  // 削除系
  const delStudent=async(s)=>{
    if(!window.confirm(`「${s}」を削除しますか？`)) return;
    const next=stList.filter(x=>x!==s);
    setStList(next);
    await hsSet('koukou:students',next);
    setDelMsg(`✅ ${stripGrade(s)} を削除しました`);
    setTimeout(()=>setDelMsg(''),3000);
  };
  const delTeacher=async(t)=>{
    if(!window.confirm(`「${t}」を削除しますか？`)) return;
    const next=tcList.filter(x=>x!==t);
    setTcList(next);

                    {(()=>{
                      try {
                        const DAYS_DANGER=14;
                        const DAYS_WARN=7;

                        const COUNT_WARN_TRI=5;
                        const now=new Date();
                        const daysSince=iso=>{
                          if(!iso) return null;

                        const fmtDaysAgo=d=>{

                          if(d===1) return '昨日';

                        // 防御：jhAllStudents/jhRenzemiAssign/jhRenzemiProgressが未定義でも落ちない
                        const safeStudents=Array.isArray(jhAllStudents)?jhAllStudents:[];
                        const safeAssign=jhRenzemiAssign||{};
                        const safeProgress=jhRenzemiProgress||{};
                        // 練ゼミ割当てがある生徒だけ抽出（新形式・旧形式両対応）
                        const targets=safeStudents.map(s=>{
                          if(!s) return null;
                          const n=stripGrade(s);
                          const a=safeAssign[n]||{};
                          // 新形式 {taking, grade} か旧形式 (文字列) かを正規化
                          const normalizeSubj=v=>{
                            if(v&&typeof v==='object'&&'taking' in v){
                              return v.taking&&v.grade?{taking:true,grade:String(v.grade)}:{taking:false,grade:null};
                            }
                            if(v&&typeof v==='string'&&v!=='none'&&['1','2','3'].includes(v)){
                              return {taking:true,grade:v};
                            }
                            return {taking:false,grade:null};
                          };
                          const mathConf=normalizeSubj(a.math);
                          const engConf=normalizeSubj(a.eng);
                          if(!mathConf.taking&&!engConf.taking) return null;
                          return {
                            fullName:s,
                            name:n,
                            grade:extractGrade(s)||'',
                            math:mathConf.taking?mathConf.grade:null,
                            eng:engConf.taking?engConf.grade:null
                          };
                        }).filter(Boolean);
                        if(targets.length===0) return(
                          <p style={{color:'#9ca3af',textAlign:'center',padding:'40px'}}>練ゼミノートが割り当てられている生徒がいません</p>
                        );
                        // 1教科ぶんの統計（v17暫定: 現在学期Rのみ集計。Phase 2で全学期対応へ）
                        const calcStats=(name,subjKey,grade)=>{
                          const term='R';
                          const items=(typeof RENZEMI_BOOKS!=='undefined'?(RENZEMI_BOOKS[`${subjKey}${grade}${term}`]||[]):[]);
                          let firstDone=0,redoDone=0,bothDone=0,xCount=0,triCount=0;
                          let latestIso=null;
                          items.forEach(it=>{
                            const p=getRenzemiProg(safeProgress,name,subjKey,`${grade}${term}`,it.num)||{};
                            if(p.first==='◯') firstDone++;
                            if(p.redo==='◯') redoDone++;
                            if(p.first==='◯'&&p.redo==='◯') bothDone++;
                            if(p.first==='✗'||p.redo==='✗') xCount++;
                            if(p.first==='△'||p.redo==='△') triCount++;
                            if(p.updatedAt&&typeof p.updatedAt==='string'){
                              if(!latestIso||p.updatedAt>latestIso) latestIso=p.updatedAt;
                            }
                          });
                          return {total:items.length,firstDone,redoDone,bothDone,xCount,triCount,latestIso};
                        };
                        const judgeStudent=(t)=>{
                          const m=t.math?calcStats(t.name,'math',t.math):null;
                          const e=t.eng?calcStats(t.name,'eng',t.eng):null;
                          const xTotal=(m?m.xCount:0)+(e?e.xCount:0);
                          const triTotal=(m?m.triCount:0)+(e?e.triCount:0);
                          let latest=null;
                          [m,e].forEach(s=>{
                            if(s&&s.latestIso){
                              if(!latest||s.latestIso>latest) latest=s.latestIso;
                            }
                          });
                          const dDays=daysSince(latest);
                          let signal='🟢',label='順調',color='#10b981',bg='#d1fae5';
                          const reasons=[];
                          if(dDays===null){
                            signal='🟡';label='記録待ち';color='#d97706';bg='#fef3c7';
                            reasons.push('まだ記録なし');
                          }else{
                            if(dDays>=DAYS_DANGER){signal='🔴';label='停滞';color='#dc2626';bg='#fee2e2';reasons.push(`${dDays}日更新なし`);}
                            else if(dDays>=DAYS_WARN){signal='🟡';label='注意';color='#d97706';bg='#fef3c7';reasons.push(`${dDays}日更新なし`);}
                            if(xTotal>=COUNT_DANGER_X){signal='🔴';label='停滞';color='#dc2626';bg='#fee2e2';reasons.push(`✗放置${xTotal}個`);}
                            else if(triTotal>=COUNT_WARN_TRI&&signal==='🟢'){signal='🟡';label='注意';color='#d97706';bg='#fef3c7';reasons.push(`△放置${triTotal}個`);}
                          }
                          return {m,e,signal,label,color,bg,reasons,latest,dDays};
                        };
                        const judged=targets.map(t=>{
                          const j=judgeStudent(t);
                          return {...t,...j};
                        });

              <div style={{background:'rgba(255,255,255,0.15)',borderRadius:'6px',padding:'6px',textAlign:'center'}}>
                <p style={{fontSize:'10px',opacity:0.8}}>入門精講</p>
                <p style={{fontSize:'16px',fontWeight:'bold'}}>{hw.nTotal}問</p>
              </div>
              <div style={{background:'rgba(255,255,255,0.15)',borderRadius:'6px',padding:'6px',textAlign:'center'}}>
                <p style={{fontSize:'10px',opacity:0.8}}>チャート</p>
                <p style={{fontSize:'16px',fontWeight:'bold'}}>{hw.cTotal}問</p>

            </div>
            <div style={{background:'rgba(255,255,255,0.2)',borderRadius:'6px',padding:'6px',textAlign:'center'}}>
              <p style={{fontSize:'10px',opacity:0.8}}>合計 {hw.total}問 ÷ {hw.weeks}週</p>

              <p style={{fontSize:'10px',opacity:0.85,marginTop:'4px',lineHeight:1.5}}>📅 4日間：1日{hw.perDay}問ずつ演習 ／ 2日間：復習 ／ 1日：塾当日</p>

        <button onClick={save} style={{width:'100%',background:'#065f46',color:'white',border:'none',borderRadius:'10px',padding:'12px',fontWeight:'bold',fontSize:'14px',cursor:'pointer'}}>

function App(){
  const [phase,setPhase]=useState('login'); // login|teacher|students|loading|main|director
  const [role,setRole]=useState('');
  const [teachers,setTeachers]=useState(ALL_TEACHERS_DEFAULT);
  const [hsStudents,setHsStudents]=useState(HS_STUDENTS_DEFAULT);
  const [jhStudents,setJhStudents]=useState(JH_STUDENTS_DEFAULT);
  const [selTeacher,setSelTeacher]=useState('');
  const [selStudents,setSelStudents]=useState([]); // [{name,type:'hs'|'jh'}]
  const [loadMsg,setLoadMsg]=useState('');
  const [bgLoading,setBgLoading]=useState(false); // バックグラウンド読込中表示
  const [bgProgress,setBgProgress]=useState({done:0,total:0}); // プログレス表示用
  // 講師画面用の教科タブ（数学・英語）
  const [teacherSubjectTab,setTeacherSubjectTab]=useState('math'); // 'math' | 'eng'

  // 高校生データ
  const [hsRecords,setHsRecords]=useState({});
  const [hsPlans,setHsPlans]=useState({});

  // 小中学生データ
  const [jhRecords,setJhRecords]=useState({});
  // v48: 進捗ダッシュボード用に「生徒名キー」のrecordsも保持
  //   jhRecords は si（index）キーだが、index が state とGASでズレると参照できない
  //   jhRecordsByName は生徒名キーなので、index に一切依存せず確実に読める
  const [jhRecordsByName,setJhRecordsByName]=useState({});
  // v68: 保存時に「最新の入力」を確実に読むための同期ミラー(Ref)。
  //   setStateは非同期。連打直後の保存で setState反映前の古い値/空を保存していた(v63〜v67のデータ消失原因)。
  //   Refはクリック処理内で即時更新するので、保存はここから同期で最新を読めば絶対にズレない。
  const jhRecByNameRef=React.useRef({}); // 生徒名キー：保存する値の正本
  const jhRecByIdxRef=React.useRef({});  // index キー：jhSetMapのlocalStorageキャッシュ用
  const hsRecRef=React.useRef({});       // 高校生 records の同期ミラー
  // v69: 未保存の生徒名Setの同期ミラー。背景再読込が「編集中(未保存)の生徒」を
  //   サーバーの古い値で上書きしてしまう競合を防ぐため、再読込適用時にここを見て保護する。
  const unsavedRef=React.useRef(new Set());
  // v70: 「このセッションで1度でも触った(編集or保存した)生徒名」のSet。
  //   v69のunsavedRefは保存成功で解除されるため、保存直後に遅れて到着する背景再読込が
  //   サーバーの古いスナップショットで画面を上書きしていた。
  //   sessionTouchedRefはセッション中に解除しない=触れた生徒の表示は再読込/キャッシュ描画から永久保護。
  //   クロス端末同期はページ再読込で正常に効く（塾内運用に支障なし）。
  const sessionTouchedRef=React.useRef(new Set());
  const [jhTextbookOverrides,setJhTextbookOverrides]=useState({});
  // v84: App内でも名前キー版を保持（インデックスずれによる参照ミスを防ぐ）
  const jhTextbookOverridesByName=React.useMemo(()=>{
    const byName={};
    Object.entries(jhTextbookOverrides||{}).forEach(([k,v])=>{
      const idx=parseInt(k);
      const fullName=(jhStudents||[])[idx];
      if(fullName) byName[stripGrade(fullName)]=v;
    });
    return byName;
  },[jhTextbookOverrides,jhStudents]);
  const [jhTestRanges,setJhTestRanges]=useState({});
  const [jhDirectives,setJhDirectives]=useState({});
  const [jhSkipItems,setJhSkipItems]=useState({});

  // 共通UI
  const [activeStudentIdx,setActiveStudentIdx]=useState(0); // selStudentsの添字
  // v67: 未保存管理。○クリックは画面stateのみ更新し、保存は切替/離脱/手動ボタン時に
  //   「その生徒の完全state」を1回だけGAS保存（連打で壊れた中間値を保存する経路を廃止）。
  //   unsavedNames: 未保存の入力がある生徒名のSet（中身が空でなければ未保存ありの意味）
  const [unsavedNames,setUnsavedNames]=useState(()=>new Set());
  const [saveMsg,setSaveMsg]=useState('');
  const [saveMsgType,setSaveMsgType]=useState('info'); // v19: 'info' | 'error'
  const [activeHint,setActiveHint]=useState(null);
  const [activeSubjMap,setActiveSubjMap]=useState({});
  const [activeChapMap,setActiveChapMap]=useState({});
  const [activeTestRound,setActiveTestRound]=useState(()=>{
    const m=new Date().getMonth()+1; // 1〜12
    return `m${m}`;
  });
  const [showTextbookModal,setShowTextbookModal]=useState(false);
  const [showTestRangeModal,setShowTestRangeModal]=useState(false);
  const [showDirectiveModal,setShowDirectiveModal]=useState(false);
  const [showHsAdjustModal,setShowHsAdjustModal]=useState(false);
  const [jhSchoolOverrides,setJhSchoolOverrides]=useState({});
  // 練ゼミノート関連（v17: RSW構造）
  // jhRenzemiAssign: {生徒名: {math:{taking,grade,rangeStart,rangeEnd}, eng:{...}}}
  //   旧形式 {math:'none|1|2|3'} は読み込み時に自動マイグレーション
  const [jhRenzemiAssign,setJhRenzemiAssign]=useState({});
  const [jhVocabAssign,setJhVocabAssign]=useState({}); // v101 英単語テキスト割当
  const [jhVocabProgress,setJhVocabProgress]=useState({}); // v101 英単語点数
  const [jhVocabHalf,setJhVocabHalf]=useState({}); // v102 フォレスタ半分モード（生徒ごと）
  const [jhVocabPassRate,setJhVocabPassRate]=useState(0.7); // v102 合格割合（教室全体・デフォルト7割）
  const [jhVocabPassRateByName,setJhVocabPassRateByName]=useState({}); // v105 生徒ごとの合格ライン（未設定は全体初期値）
  // jhRenzemiProgress: {生徒名|subj|gradeTerm(例:1R)|num: {first,redo,checkedAt,checkedBy,updatedAt}}
  //   旧形式 (生徒名|subj|grade|num) も読み込み時にgradeを「{grade}R」として扱う
  const [jhRenzemiProgress,setJhRenzemiProgress]=useState({});
  // jhRenzemiDeadlines: {gradeTerm(例:1R): {math:'YYYY-MM-DD', eng:'YYYY-MM-DD'}}
  const [jhRenzemiDeadlines,setJhRenzemiDeadlines]=useState({});
  // v36: 学校×学年のテスト月マスタ
  // {schoolGrade(例:'白川中_中3'): {defaultRound:'m9', updatedAt:'2026-05-09'}}
  // テスト範囲を保存するたびに自動学習
  // モーダルを開いた時、データがなければマスタから初期月を取得
  const [jhSchoolGradeMaster,setJhSchoolGradeMaster]=useState({});
  // v38: 生徒別の個別学習方針（特殊な10名向け）
  // {studentName: '特別な方針'}
  // 生徒別方針があれば学校×学年マスタより優先される
  const [jhStudentDirectives,setJhStudentDirectives]=useState({});
  // currentTerm: 教室全体の現在学期 'R'|'S'|'W'
  const [currentTerm,setCurrentTerm]=useState('R');
  // 高校生英文法
  const [hsEngAssign,setHsEngAssign]=useState({}); // {生徒名: {set:'eng_oiwa|eng_hijii|none', from:1, to:99, startDate:'', deadline:''}}
  const [hsEngRecords,setHsEngRecords]=useState({}); // {生徒名: {item_id: {status:'未|◯|△|✗', askedQs:[1,3,5]}}}

  // v32: 'saving' = 保存中（黄、消えない）／'info' = 成功（緑、2.5秒）／'error' = 失敗（赤、6秒・点滅）
  const flash=(msg,type='info')=>{
    setSaveMsg(msg);
    setSaveMsgType(type);
    if(type==='saving') return; // 保存中は次のflashで上書きされるまで残す
    setTimeout(()=>setSaveMsg(''),type==='error'?6000:2500);
  };

  // v67: 未保存があるままタブを閉じる/リロードしようとしたらブラウザ標準の確認を出す
  // v92: さらに sendBeacon で緊急保存を送る。通常のfetchはタブを閉じた瞬間ブラウザに殺されるが、
  //   sendBeaconは閉じた後も配送される（「閉じて消えた」経路を塞ぐ最後の保険）。
  //   送信内容はRefミラー（同期・最新確定値）から構築。GAS側はdoPostで受信。
  useEffect(()=>{
    const h=(e)=>{
      if(unsavedNames.size>0){
        try{
          unsavedNames.forEach(nm=>{
            const hsRec=hsRecRef.current[nm];
            if(hsRec&&Object.keys(hsRec).length>0){
              const b=new URLSearchParams({action:'set',key:`koukou:records:${nm}`,value:JSON.stringify(hsRec)});
              navigator.sendBeacon(GAS_HS,b);
              return;
            }
            const jhRec=jhRecByNameRef.current[nm];
            if(jhRec&&Object.keys(jhRec).length>0){
              const b=new URLSearchParams({action:'set',key:`${JH_PREFIX}records__item__${nm}`,value:JSON.stringify(jhRec)});
              navigator.sendBeacon(GAS_JH,b);
            }
          });
        }catch(err){ console.warn('[beforeunload] beacon送信失敗:',err); }
        e.preventDefault(); e.returnValue='';
      }
    };
    window.addEventListener('beforeunload',h);
    return ()=>window.removeEventListener('beforeunload',h);
  },[unsavedNames]);

  // DB(chapters.json)ロード v23: キャッシュバスター付き（C対策）
  useEffect(()=>{

  // v46: 学校情報も個別キー保存方式に変更
  //   旧バグ: 130名 × 学校名 = 8000文字超でURL長制限超過していた
  //   新: shochugaku:schoolOverrides__item__生徒名 で個別保存
  const jhSaveSchool=async(name,school)=>{

  const jhSaveTestRange=async(key,data)=>{

      updated={...prev,[key]:data};

    });

    // v34: 個別キー保存（URL長制限回避）
    const result=await jhSetMap('testRanges',key,data,updated);
    // 保存後の読み戻し検証（紗耶佳先生指摘対応）
    if(result&&result.ok===false){
      flash(`❌ テスト範囲の保存失敗：${result.reason||''}（紗耶佳先生に確認お願いします）`,'error');
      return;
    }
    // v36: 学校×学年マスタを自動学習
    //   保存されたkey（例: '白川中_中3'）と data.round（例: 'm9'）から、マスタを更新
    //   こうすることで、同じ学校×学年の他生徒を開いた時、月が自動で選ばれる
    if(data.round&&key.includes('_')){
      const parts=key.split('_');
      // key形式は'白川中_中3'（新形式）か'白川中_中3_m6'（旧形式）の2パターン
      // どちらの場合も最初の2要素が「学校_学年」
      const sgKey=`${parts[0]}_${parts[1]}`;
      const updatedMaster={...jhSchoolGradeMaster,[sgKey]:{defaultRound:data.round,updatedAt:new Date().toISOString()}};
      setJhSchoolGradeMaster(updatedMaster);
      // GASに保存（マスタはサイズ小さいのでjhSetでOK）
      jhSet('schoolGradeMaster',updatedMaster).catch(e=>console.warn('マスタ保存失敗:',e));
    }
    // 読み戻し検証: 100ms待ってから保存内容を取得して照合
    await new Promise(r=>setTimeout(r,300));
    try{
      const url=`${GAS_JH}?action=get&key=${encodeURIComponent(JH_PREFIX+'testRanges__item__'+key)}`;
      const r=await fetch(url,{cache:'no-store'});
      const d=await r.json();
      if(d&&d.value){
        const saved=JSON.parse(d.value);
        // 重要フィールドの照合（X生 or Y生のうち、登録されたフィールドが反映されているか）
        const matches=['xMathStart','xMathEnd','xEngStart','xEngEnd','yMathStart','yMathEnd','yEngStart','yEngEnd']
          .filter(f=>data[f])
          .every(f=>saved[f]===data[f]);
        if(matches){
          flash('✅ テスト範囲を保存しました（検証済）');
        }else{
          flash('⚠️ 保存に不一致が検出されました。紗耶佳先生に再確認してください','error');
        }
      }else{
        flash('⚠️ 保存後の検証で取得できませんでした','error');
      }
    }catch(e){
      console.warn('保存検証失敗:',e);
      flash('✅ テスト範囲を保存しました（検証スキップ）');
    }

  const jhToggleSkip=async(grade,subjKey,itemId)=>{

  // 高校生サイドバー用サマリー
  const getHsSummary=idx=>{
    const stu=selStudents[idx];
    if(!stu||stu.type!=='hs') return{total:0,done:0};
    const n=stripGrade(stu.name);
    const rec=hsRecords[n]||{};
    const plan=migratePlan(hsPlans[n]||{});
    const rmap=plan.roadmap||[];
    const skipSet=new Set(plan.skipItems||[]);
    // ロードマップの現在ステップを判定
    const auto=getAutoCurrentIdx(rmap,rec,plan.skipItems||[]);
    const sIdx=(plan.currentIdx!==null&&plan.currentIdx!==undefined&&plan.currentIdx>=0&&plan.currentIdx<rmap.length)?plan.currentIdx:auto;
    const cs=rmap[sIdx]||null;
    if(!cs) return{total:0,done:0};
    let t=0,d=0;
    if(cs.kind==='eng'){
      const es=ENG_SETS[cs.engSet];
      if(!es) return{total:0,done:0};
      const eL=getChaps(es.dataKey).length;
      const eFrom=Math.min(cs.engRange?.from||1,eL),eTo=Math.min(cs.engRange?.to||eL,eL);
      const studentEngRecs=hsEngRecords[n]||{};
      getChaps(es.dataKey).forEach((ch,ci)=>{
        if(ci+1<eFrom||ci+1>eTo) return;
        ch.items.forEach(it=>{t++;if((studentEngRecs[it.id]||{status:'未'}).status==='◯')d++;});
      });
    }else{
      const ss=cs.textbookSet?SETS[cs.textbookSet]:null;
      if(!ss) return{total:0,done:0};
      const nyumonKey=ss.nyumon||'ia';
      const lv=cs.maxLevel||5;
      const nL=getNyumon(nyumonKey).length, cL=getChaps(ss.dataKey).length;
      const nFrom=Math.min(cs.nyumonRange?.from||1,nL),nTo=Math.min(cs.nyumonRange?.to||nL,nL);
      const cFrom=Math.min(cs.chartRange?.from||1,cL), cTo=Math.min(cs.chartRange?.to||cL,cL);
      getNyumon(nyumonKey).forEach((ch,ci)=>{
        if(ci+1<nFrom||ci+1>nTo) return;
        ch.items.forEach(it=>{if(skipSet.has(`IA_${it.id}`)) return;t++;if((rec[`IA_${it.id}`]||{status:'未'}).status==='◯')d++;});
      });
      getChaps(ss.dataKey).forEach((ch,ci)=>{
        if(ci+1<cFrom||ci+1>cTo) return;
        ch.items.forEach(it=>{if((it.level||1)>lv||skipSet.has(`CHART_${it.id}`)) return;t++;if((rec[`CHART_${it.id}`]||{status:'未'}).status==='◯')d++;});
      });
    }
    return{total:t,done:d};
  };

  const getJhSummary=idx=>{

      const defaultKey=(grade.startsWith('中')||grade.startsWith('小'))?`${grade}Y_${subj}`:`${grade}_${subj}`;
      const rawKey=override||defaultKey;
      if(rawKey&&rawKey.startsWith('none_')) return;
      const chs=CHAPTERS[rawKey]||[];
      const skKey=`${grade}_${subj}`;
      const skList=jhSkipItems[skKey]||[];

  // ── フェーズ分岐 ──

      onAddJhStudent={async(name,grade,school)=>{

      onAddHsStudent={async(name,grade)=>{

  if(phase==='loading') return(

  // ── メイン画面 ──
  // 高校生用変数
  // ロードマップ対応：現在のステップを判定
  const curPlanRaw=hsPlans[curName]||{};

  const curRecords=hsRecords[curName]||{};
  const curSkipItems=curPlanFull.skipItems||[];
  const autoCurIdx=getAutoCurrentIdx(curRoadmap,curRecords,curSkipItems);
  // 手動上書きがあればそれを優先、なければ自動
  const stepIdx=(curPlanFull.currentIdx!==null&&curPlanFull.currentIdx!==undefined&&curPlanFull.currentIdx>=0&&curPlanFull.currentIdx<curRoadmap.length)?curPlanFull.currentIdx:autoCurIdx;
  const curStep=curRoadmap[stepIdx]||null;
  // 現在のステップを「curPlan」として扱う（既存コードとの互換のため）
  const curPlan=curStep?{...curStep,memo:curPlanFull.memo,skipItems:curPlanFull.skipItems}:curPlanFull;
  const curSet=curPlan.textbookSet?SETS[curPlan.textbookSet]:null;

  const setActiveSubj=s=>guardUnsaved(()=>setActiveSubjMap(p=>({...p,[activeGrade]:s})));
  const jhTextbookKey=(si,subj)=>{

    if(grade.startsWith('中')) return `${grade}Y_${subj}`;
    // 小学生はデフォルトY（明光式ワーク）
    if(grade.startsWith('小')) return `${grade}Y_${subj}`;
    return `${grade}_${subj}`;
  };
  const chapKey=jhSi>=0?jhTextbookKey(jhSi,activeSubj):null;
  const jhChapters=chapKey?CHAPTERS[chapKey]||[]:[];
  const activeChapIdx=activeChapMap[chapKey]||0;
  const setActiveChap=i=>setActiveChapMap(p=>({...p,[chapKey]:i}));
  const activeChap=jhChapters[activeChapIdx];

  // テスト範囲アラート計算
  const getTestAlert=(si,subj,roundId)=>{
    const fullName=jhStudents[si]||'';
    const sName=fullName.replace(/（.+?）/,'');
    const school=jhSchoolOverrides[sName]||STUDENT_SCHOOLS[sName];
    const grade=extractGrade(fullName);
    if(!school||!grade.startsWith('中')) return null;
    const key=`${school}_${grade}_${roundId}`;
    const range=jhTestRanges[key];
    if(!range) return null;
    const endId=subj==='数学'?range.mathEnd:range.engEnd;
    const startId=subj==='数学'?range.mathStart:range.engStart;
    if(!endId&&!startId) return null;
    const tKey=jhSi>=0?jhTextbookKey(jhSi,subj):null;
    if(!tKey) return null;
    const chs=CHAPTERS[tKey]||[];
    const allItems=chs.flatMap(ch=>ch.items);
    const endIdx=endId?allItems.findIndex(it=>it.id===endId):-1;
    const startIdx=startId?allItems.findIndex(it=>it.id===startId):-1;
    if(endIdx<0) return null;
    const endRecord=jhGetRecord(si,`${subj}_${endId}`);
    if(endRecord.status==='◯') return{type:'done',startId,endId,startIdx,endIdx,
      msg:`🚨 ${subj}テスト範囲終了！折り返して復習してください`,color:'#fef2f2',border:'#f87171'};
    let completedCount=0;
    for(let i=0;i<=endIdx;i++){

                  label=d1?`${activeGrade}・${activeSubj}`:d2?`${activeGrade}・全教科`:d3?`全学年・${activeSubj}`:'全学年・全教科';

                const subjBg=isStudentSpecific?'#fff7ed':(activeSubj==='数学'?'#dbeafe':activeSubj==='英語'?'#dcfce7':'#f3e8ff');

                  </div>
